function figTri(){return `<svg viewBox="0 0 360 190" style="width:100%;max-width:380px" aria-label="power triangle"><polygon points="30,160 260,160 260,45" fill="var(--acc2)" stroke="var(--acc)" stroke-width="2"/><text x="120" y="180" font-size="13" text-anchor="middle">P = 19.1 kW (real)</text><text x="270" y="108" font-size="13">Q = 14.3 kvar</text><text x="100" y="92" font-size="13" transform="rotate(-27 100 92)">S = 23.9 kVA</text><path d="M70 160 A40 40 0 0 0 64 145" fill="none" stroke="var(--ink)"/><text x="78" y="150" font-size="12">φ = 36.9°</text></svg>`}
function figXf(mode){
 const both=mode===2;
 const box=(x,w,t,sub,on)=>`<rect x="${x}" y="30" width="${w}" height="34" rx="6" fill="${on?'var(--acc2)':'var(--card)'}" stroke="${on?'var(--acc)':'var(--line)'}" ${on?'':'stroke-dasharray="4 3"'}/><text x="${x+w/2}" y="46" font-size="11" text-anchor="middle" font-weight="700">${t}</text><text x="${x+w/2}" y="59" font-size="10" text-anchor="middle">${sub}</text>`;
 return `<svg viewBox="0 0 560 100" style="width:100%;max-width:640px" role="img" aria-label="transformer protection one-line"><line x1="8" y1="47" x2="552" y2="47" stroke="var(--ink)" stroke-width="2"/>
 ${box(30,110,'Primary device',both?'≤ 250 % of I<sub>p</sub>'.replace(/<\/?sub>/g,''):'125 / 167 / 300 %',true)}
 <circle cx="215" cy="47" r="22" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><circle cx="245" cy="47" r="22" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><text x="230" y="90" font-size="11" text-anchor="middle">Transformer</text>
 ${box(300,120,'Secondary device',both?'125 % (≥9 A) / 167 %':'(not used)',both)}
 <rect x="470" y="32" width="70" height="30" rx="6" fill="var(--code)" stroke="var(--line)"/><text x="505" y="52" font-size="11" text-anchor="middle">Load</text></svg>`}
const FIGS={xf1:()=>figXf(1),xf2:()=>figXf(2),pct:figPct,bars1:()=>barSvg([['Bus bar',50],['Fuse holder',10],['Terminal block',10],['Disconnect switch',5],['Starter + overload',5]]),
 bars2:()=>barSvg([['Bus bar',50],['Fuse holder',10],['Terminal block',10],['Class J fuse (IR)',200],['65 kA combination',65]]),tri:figTri};

/* ============================== question cards ============================== */
const prog=store.get('ul508a.prog',{});
function saveProg(){store.set('ul508a.prog',prog);updateScore()}
function updateScore(){const g=Object.values(prog).filter(v=>v==='got').length;$('#score').textContent=`Knew it: ${g}/${Q.length}`}
function cardHTML(q,i,opts={}){
 const st=prog[q.id];
 return `<article class="card" data-id="${q.id}">
  <div class="row"><span class="tag">${TOPICS[q.t]}</span><span class="tag d">${'●'.repeat(q.d)}${'○'.repeat(3-q.d)}</span>${st?`<span class="tag ${st==='got'?'':'d'}">${st==='got'?'✓ knew it':'✗ review'}</span>`:''}
   ${q.sim?`<button class="btn sm" data-sim="${q.sim}">Try in simulator →</button>`:''}</div>
  <div class="q">${opts.n!=null?`Q${opts.n}. `:''}${q.q}</div>${q.src?`<div class="note">Source: ${q.src}</div>`:''}
  ${q.num?`<div class="row"><label>Your answer (${q.num.u}): <input type="number" step="any" class="guess" style="width:110px"></label><button class="btn sm chk">Check</button><span class="res"></span></div>`:''}
  <div class="row" style="margin-top:8px"><button class="btn pri sm rev">Show answer</button></div>
  <div class="reveal hide">
   <div class="ans"><b>Answer:</b> ${q.a}</div>
   ${q.steps?`<div class="note" style="margin-top:8px"><b>Math / steps</b></div><ol class="steps">${q.steps.map(s=>`<li>${s}</li>`).join('')}</ol>`:''}
   ${q.fig?`<div>${FIGS[q.fig]()}</div>`:''}
   ${q.why?`<div class="why"><b>Why / explanation:</b> ${q.why}</div>`:''}
   <div class="row"><span class="note">How did you do?</span><button class="btn sm got">✓ I knew it</button><button class="btn sm miss">✗ Need review</button></div>
  </div></article>`}
function wireCards(root,onMark){
 root.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const c=b.closest('.card');if(!c&&!b.dataset.sim)return;
  if(b.dataset.sim){go('sim',b.dataset.sim);return}
  const q=Q.find(x=>x.id===c.dataset.id);
  if(b.classList.contains('rev')){const r=$('.reveal',c);r.classList.toggle('hide');b.textContent=r.classList.contains('hide')?'Show answer':'Hide answer'}
  else if(b.classList.contains('chk')){const v=parseFloat($('.guess',c).value),res=$('.res',c);
   if(isNaN(v)){res.textContent='Enter a number first.';return}
   const ok=Math.abs(v-q.num.v)<=Math.abs(q.num.v)*q.num.tol+1e-9;
   res.innerHTML=ok?'<span class="ok">✓ Correct</span>':'<span class="bad">✗ Not quite – open the answer and steps</span>'}
  else if(b.classList.contains('got')||b.classList.contains('miss')){prog[q.id]=b.classList.contains('got')?'got':'miss';saveProg();onMark&&onMark(q,c)}
 })}

/* ---------- Study view ---------- */
function viewStudy(){
 const m=$('#main');let topic=store.get('ul508a.topic','all');
 m.innerHTML=`<div class="banner"><b>Read first:</b> Built from the UL 508A standard structure and NEC motor tables (Tables 430.248/.250). Treat percentages, defaults and table values as study aids and <b>verify against the edition your exam references</b>. Answers are hidden – try to work each one first; numeric questions have a checker.</div>
 <div class="card"><div class="row"><label>Topic <select id="ft"><option value="all">All topics</option>${Object.entries(TOPICS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
 <button class="btn sm" id="showAll">Show all answers</button><button class="btn sm" id="hideAll">Hide all</button><button class="btn sm" id="resetP">Reset progress</button></div>
 <div class="prog" style="margin-top:10px"><i id="pbar"></i></div></div><div id="list"></div>`;
 const list=$('#list');
 const draw=()=>{const qs=Q.filter(q=>topic==='all'||q.t===topic);
  list.innerHTML=qs.map((q,i)=>cardHTML(q,i)).join('');
  const g=Object.values(prog).filter(v=>v==='got').length;$('#pbar').style.width=(g/Q.length*100)+'%'};
 $('#ft').value=topic;$('#ft').onchange=e=>{topic=e.target.value;store.set('ul508a.topic',topic);draw()};
 $('#showAll').onclick=()=>$$('.reveal',list).forEach(r=>r.classList.remove('hide'));
 $('#hideAll').onclick=()=>$$('.reveal',list).forEach(r=>r.classList.add('hide'));
 $('#resetP').onclick=()=>{if(confirm('Clear all progress?')){for(const k in prog)delete prog[k];saveProg();draw()}};
 wireCards(list,(q,c)=>{c.outerHTML=cardHTML(q,0).replace('reveal hide','reveal');const g=Object.values(prog).filter(v=>v==='got').length;$('#pbar').style.width=(g/Q.length*100)+'%'});
 draw()}

/* ---------- Quiz view ---------- */
function viewQuiz(){
 const m=$('#main');
 m.innerHTML=`<div class="card"><div class="row"><label>Topic <select id="qt"><option value="all">All topics</option>${Object.entries(TOPICS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></label>
 <label><input type="checkbox" id="qm"> Only questions I missed / haven’t answered</label><button class="btn pri" id="qs">Start quiz</button></div></div><div id="quiz"></div>`;
 $('#qs').onclick=()=>{
  let qs=Q.filter(q=>$('#qt').value==='all'||q.t===$('#qt').value);
  if($('#qm').checked)qs=qs.filter(q=>prog[q.id]!=='got');
  qs=qs.map(q=>[Math.random(),q]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
  if(!qs.length){$('#quiz').innerHTML='<div class="card">Nothing to quiz – you’ve marked everything as known 🎉</div>';return}
  let i=0,got=0;const box=$('#quiz');
  const show=()=>{
   if(i>=qs.length){box.innerHTML=`<div class="card"><div class="big">Done: ${got} / ${qs.length}</div><p>${got/qs.length>=.8?'Nice – you’re exam-ready on this set.':'Re-run with “only missed” to drill the weak ones.'}</p></div>`;return}
   box.innerHTML=`<div class="note">Question ${i+1} of ${qs.length}</div><div class="prog" style="margin:6px 0 12px"><i style="width:${i/qs.length*100}%"></i></div>`+cardHTML(qs[i],i,{n:i+1});
   const c=$('.card',box);$('.row:last-of-type',$('.reveal',c)).innerHTML='<button class="btn pri sm got">✓ Got it – next</button><button class="btn sm miss">✗ Missed – next</button>'};
  box.onclick=null;
  wireCards(box,(q)=>{if(prog[q.id]==='got')got++;i++;show()});
  show()}}

/* ---------- Reference view ---------- */
function viewRef(){
 const m=$('#main');
 const flcRows=(T,volts)=>{const hps=[...new Set(volts.flatMap(v=>Object.keys(T[v]).map(Number)))].sort((a,b)=>a-b);
  return `<table><tr><th>hp</th>${volts.map(v=>`<th>${v} V</th>`).join('')}</tr>${hps.map(h=>`<tr><td>${h}</td>${volts.map(v=>`<td>${T[v][h]??'–'}</td>`).join('')}</tr>`).join('')}</table>`};
 m.innerHTML=`<div class="banner">Reference tables reproduced for study. Always confirm against the standard / NEC edition used in your exam.</div>
 <div class="card"><h3>Motor full-load current (A)</h3><div class="grid"><div class="tbl"><b>3-phase (NEC 430.250 / UL 508A Table 50.1)</b>${flcRows(FLC3,[208,230,460,575])}</div><div class="tbl"><b>Single-phase (NEC 430.248)</b>${flcRows(FLC1,[115,230])}</div></div></div>
 <div class="card"><h3>Motor branch-circuit rules (max % of table FLC)</h3><div class="tbl"><table><tr><th>Item</th><th>Rule</th></tr>
 <tr><td>Conductors</td><td>125 % of FLC (largest motor) + 100 % others</td></tr>
 <tr><td>Non-time-delay fuse</td><td>300 % (up to 400 % if it blocks starting)</td></tr>
 <tr><td>Dual-element fuse</td><td>175 % (225 %)</td></tr>
 <tr><td>Inverse-time breaker</td><td>250 % (400 % ≤ 100 A / 300 % &gt; 100 A)</td></tr>

 <li>3-phase apparent power <code>S = √3 · V · I</code></li><li>Real power <code>P = √3 · V · I · PF</code>; <code>Q = √3 · V · I · sin φ</code></li>

 <li>Control transformer protection (primary only): ≥ 9 A → 125 %; &lt; 9 A → 167 %; &lt; 2 A → 300 %</li></ul></div>`}

const SC_PRESETS={

 <div class="tbl" style="margin-top:10px"><table id="tb"></table></div></div><div class="card" id="out"></div>`;

  const min=Math.min(...rows.map(r=>+r.v)),lows=rows.filter(r=>+r.v===min).map(r=>SC_TYPES[r.type][0]);

function simStarter(box){
 box.innerHTML=`<div class="card"><h3 style="margin-top:0">3-wire starter with thermal overload</h3>

 <label>Motor current <input id="load" type="range" min="0.5" max="8" step="0.05" value="1"> <b id="lv">1.00 × FLA</b></label>
 <label>Class <select id="cls"><option value="10">10</option><option value="20" selected>20</option><option value="30">30</option></select></label>

 <div class="grid"><div class="card" style="margin:0"><svg id="lad" viewBox="0 0 560 250" style="width:100%"></svg></div>
 <div class="card" style="margin:0"><canvas id="cv" height="250"></canvas></div></div>
 <div class="card" style="margin-top:14px"><div class="row"><div style="flex:1;min-width:200px"><div class="note">Thermal element (trips at 100 %)</div><div class="prog" style="height:16px"><i id="heat" style="background:var(--warn)"></i></div></div><div id="stat" class="big" style="min-width:160px"></div></div></div>`;
 const S={start:false,stop:false,m:false,trip:false,heat:0,t:0};
 const hold=(id,k)=>{const b=$(id,box);const on=e=>{e.preventDefault();S[k]=true},off=()=>{S[k]=false};b.addEventListener('pointerdown',on);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,off))};
 hold('#bStart','start');hold('#bStop','stop');
 $('#bReset',box).onclick=()=>{if(S.heat<0.5)S.trip=false};
 $('#load',box).oninput=e=>$('#lv',box).textContent=(+e.target.value).toFixed(2)+' × FLA';
 const cv=$('#cv',box),cx=cv.getContext('2d');
 const resize=()=>{const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=250*d;cx.setTransform(d,0,0,d,0,0)};resize();
 const tripTime=(M,N)=>M<=1.0?Infinity:35*N/(M*M-1);
 function curve(M,N){
  const W=cv.getBoundingClientRect().width,H=250,L=44,B=28,Rr=W-12,T=12,xs=v=>L+(Math.log10(v)-0)/(Math.log10(10))*(Rr-L),ys=v=>T+(1-(Math.log10(v)-Math.log10(1))/(Math.log10(10000)-0))*(H-B-T);
  cx.clearRect(0,0,W,H);cx.fillStyle=css('--ink');cx.strokeStyle=css('--line');cx.font='11px system-ui';
  for(const v of [1,2,3,5,10]){cx.beginPath();cx.moveTo(xs(v),T);cx.lineTo(xs(v),H-B);cx.stroke();cx.fillText(v+'×',xs(v)-6,H-12)}
  for(const v of [1,10,100,1000,10000]){cx.beginPath();cx.moveTo(L,ys(v));cx.lineTo(Rr,ys(v));cx.stroke();cx.fillText(v>=1000?v/1000+'k':v,6,ys(v)+4)}
  cx.fillText('Trip time (s) vs current (× FLA) – illustrative',L,10);
  for(const n of [10,20,30]){cx.strokeStyle=n===N?css('--acc'):css('--line');cx.lineWidth=n===N?3:1.5;cx.beginPath();let f=true;
   for(let m=1.06;m<=10;m*=1.02){const t=Math.min(Math.max(tripTime(m,n),1),10000);const x=xs(m),y=ys(t);f?cx.moveTo(x,y):cx.lineTo(x,y);f=false}cx.stroke();cx.fillStyle=css('--mut');cx.fillText('Class '+n,xs(8.5),ys(Math.max(tripTime(9,n),1))-4)}
  cx.lineWidth=1;const mm=Math.min(Math.max(M,1.01),10);cx.fillStyle=S.trip?css('--bad'):css('--cur');cx.beginPath();cx.arc(xs(mm),ys(Math.min(Math.max(tripTime(mm,N),1),10000)),6,0,7);cx.fill()}
 let last=performance.now(),raf;

   <polyline points="122,70 170,70 170,70" ${w(A)}/>
   <polyline points="170,70 170,100 ${200},100" ${w(A&&S.m)}/><polyline points="170,70 200,70" ${w(A&&S.start)}/>
   <text x="228" y="48" font-size="11" text-anchor="middle">START (NO)</text><line x1="200" y1="60" x2="200" y2="80" ${w(A&&S.start)}/><line x1="222" y1="60" x2="222" y2="80" ${w(B)}/><line x1="200" y1="70" x2="200" y2="70"/>
   <text x="228" y="118" font-size="11" text-anchor="middle">M seal-in (NO)</text><line x1="200" y1="90" x2="200" y2="110" ${w(A&&S.m)}/><line x1="222" y1="90" x2="222" y2="110" ${w(B)}/>

   <text x="330" y="48" font-size="11" text-anchor="middle">OL (NC)</text><line x1="300" y1="60" x2="300" y2="80" ${w(B)}/><line x1="322" y1="60" x2="322" y2="80" ${w(B&&!S.trip)}/>${S.trip?'<line x1="296" y1="82" x2="326" y2="58" stroke="var(--bad)" stroke-width="3"/>':''}
   <polyline points="322,70 440,70" ${w(coilE)}/><circle cx="460" cy="70" r="20" fill="${coilE?'var(--okbg)':'var(--card)'}" stroke="${c(coilE)}" stroke-width="3"/><text x="460" y="75" font-size="14" font-weight="700" text-anchor="middle">M</text>
   <polyline points="480,70 530,70" ${w(coilE)}/>
   <rect x="60" y="150" width="440" height="80" rx="8" fill="var(--card)" stroke="var(--line)"/>
   <text x="80" y="176" font-size="12">Contactor: <tspan font-weight="700" fill="${S.m?'var(--ok)':'var(--mut)'}" style="fill:${S.m?'var(--ok)':'var(--mut)'}">${S.m?'CLOSED':'OPEN'}</tspan> · Motor current: ${(M).toFixed(2)} × FLA</text>
   <text x="80" y="198" font-size="12">Overload: <tspan font-weight="700" style="fill:${S.trip?'var(--bad)':'var(--ok)'}">${S.trip?'TRIPPED':'OK'}</tspan></text>
   <g transform="translate(430 190)" style="transform-origin:center"><circle r="${S.m?18:18}" fill="none" stroke="${c(S.m)}" stroke-width="3"/><text y="5" text-anchor="middle" font-size="13" font-weight="700">M</text>${S.m?`<g style="transform-origin:0 0;transform:rotate(${(now/4)%360}deg)"><line x1="0" y1="0" x2="0" y2="-14" stroke="var(--ok)" stroke-width="3"/></g>`:''}</g>`;
  $('#heat',box).style.width=Math.min(S.heat,1)*100+'%';
  const eta=M>1?tripTime(M,N)*(1-S.heat):null;
  $('#stat',box).innerHTML=S.trip?`<span class="bad">TRIPPED${S.heat>=.5?' – cooling':' – reset OK'}</span>`:S.m?(M>1?`Trips in ≈ ${fmt(eta,1)} s`:'<span class="ok">Running</span>'):'Stopped';
  curve(load,N);

 raf=requestAnimationFrame(loop);

/* ---------- 3-phase waves ---------- */
function simWave(box){
 box.innerHTML=`<div class="card"><h3 style="margin-top:0">3-phase voltage, current and power</h3>
 <div class="grid"><div class="fld"><label>Line voltage (V)</label><select id="wv"><option>208</option><option>230</option><option selected>460</option><option>480</option><option>575</option></select></div>

 <div class="card" style="margin-top:14px" id="wo"></div>`;
 const wc=$('#wc',box),pc=$('#pc',box);
 const fit=c=>{const r=c.getBoundingClientRect(),d=devicePixelRatio||1;c.width=r.width*d;c.height=240*d;c.getContext('2d').setTransform(d,0,0,d,0,0);return r.width};
 let W1=fit(wc),W2=fit(pc);const rs=()=>{W1=fit(wc);W2=fit(pc)};window.addEventListener('resize',rs);
 let raf,t0=performance.now();
 const loop=now=>{
  const V=+$('#wv',box).value,I=+$('#wi',box).value,pf=+$('#wp',box).value,phi=Math.acos(pf);
  $('#wil',box).textContent=I;$('#wpf',box).textContent=pf.toFixed(2);
  const S=SQ3*V*I,P=S*pf,Q=S*Math.sin(phi);
  $('#wo',box).innerHTML=`<div class="grid"><div><div class="note">Apparent S = √3·V·I</div><div class="big">${fmt(S/1000,2)} kVA</div></div><div><div class="note">Real P = S·PF</div><div class="big">${fmt(P/1000,2)} kW</div><div class="note">${fmt(P/746,1)} hp output-equivalent at 100 % eff.</div></div><div><div class="note">Reactive Q = S·sin φ</div><div class="big">${fmt(Q/1000,2)} kvar</div></div><div><div class="note">Phase angle φ</div><div class="big">${fmt(phi*180/Math.PI,1)}°</div></div></div>
  <p class="note">V<sub>L-N</sub> = ${fmt(V/SQ3,0)} V · Steps: S = 1.732 × ${V} × ${I} = ${fmt(S)} VA; P = ${fmt(S)} × ${pf.toFixed(2)} = ${fmt(P)} W.</p>`;
  const th=((now-t0)/1000)*2*Math.PI*0.5;
  const ink=css('--ink'),line=css('--line'),cA=css('--ph-a'),cB=css('--ph-b'),cC=css('--ph-c'),cI=css('--cur');
  let x=wc.getContext('2d');const H=240;x.clearRect(0,0,W1,H);x.strokeStyle=line;x.lineWidth=1;x.beginPath();x.moveTo(0,H/2);x.lineTo(W1,H/2);x.stroke();
  [[cA,0],[cB,120],[cC,240]].forEach(([c,a])=>{x.strokeStyle=c;x.lineWidth=2.5;x.beginPath();for(let i=0;i<=W1;i+=2){const y=H/2-Math.sin(th-i/W1*4*Math.PI-a*Math.PI/180)*H*0.38;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke()});
  x.strokeStyle=cI;x.setLineDash([6,4]);x.lineWidth=2.5;x.beginPath();for(let i=0;i<=W1;i+=2){const y=H/2-Math.sin(th-i/W1*4*Math.PI-phi)*H*0.25;i?x.lineTo(i,y):x.moveTo(i,y)}x.stroke();x.setLineDash([]);
  x.fillStyle=ink;x.font='11px system-ui';x.fillText('+ V',4,14);
  x=pc.getContext('2d');x.clearRect(0,0,W2,H);const cxp=W2/2,cyp=H/2,R=Math.min(W2,H)*0.4;x.strokeStyle=line;x.lineWidth=1;x.beginPath();x.arc(cxp,cyp,R,0,7);x.stroke();
  const arrow=(a,r,c,w,lab,dash)=>{x.strokeStyle=c;x.fillStyle=c;x.lineWidth=w;x.setLineDash(dash?[6,4]:[]);const ex=cxp+Math.cos(a)*r,ey=cyp-Math.sin(a)*r;x.beginPath();x.moveTo(cxp,cyp);x.lineTo(ex,ey);x.stroke();x.setLineDash([]);x.beginPath();x.arc(ex,ey,4,0,7);x.fill();x.fillStyle=ink;x.font='bold 12px system-ui';x.fillText(lab,ex+Math.cos(a)*8-4,ey-Math.sin(a)*8+4)};
  arrow(th,R,cA,3,'Va');arrow(th-2*Math.PI/3,R,cB,3,'Vb');arrow(th-4*Math.PI/3,R,cC,3,'Vc');arrow(th-phi,R*0.7,cI,3,'Ia',true);
  x.strokeStyle=ink;x.lineWidth=1;x.beginPath();x.arc(cxp,cyp,R*0.25,th-phi,th,false);x.stroke();
  raf=requestAnimationFrame(loop)};
 raf=requestAnimationFrame(loop);stopFn=()=>{cancelAnimationFrame(raf);window.removeEventListener('resize',rs)}}

/* ---------- Fault current & transformers ---------- */
function simXfmr(box){
 box.innerHTML=`<div class="card"><h3 style="margin-top:0">Transformer overcurrent protection (power &amp; control)</h3>
 <p class="note">Enter the transformer nameplate. The calculator applies the primary-only and the primary + secondary rules (NEC 450.3(B)) and shows every step.</p>
 <div class="row" style="margin-bottom:10px"><button class="btn sm pre" data-k="0.5,1,480,120">Control 500 VA 480/120</button><button class="btn sm pre" data-k="1,1,480,120">Control 1 kVA 480/120</button><button class="btn sm pre" data-k="3,1,480,120">Control 3 kVA 480/120</button><button class="btn sm pre" data-k="75,3,480,208">Power 75 kVA 3φ 480→208Y</button><button class="btn sm pre" data-k="150,3,480,208">Power 150 kVA 3φ 480→208Y</button></div>
 <div class="grid"><div class="fld"><label>Rating (kVA) – e.g. 0.5 = 500 VA</label><input id="kv" type="number" step="any" value="0.5"></div>
 <div class="fld"><label>Phases</label><select id="xp"><option value="1">Single-phase</option><option value="3">3-phase</option></select></div>
 <div class="fld"><label>Primary voltage (V)</label><input id="vp" type="number" value="480"></div>
 <div class="fld"><label>Secondary voltage (V, line-line)</label><input id="vs" type="number" value="120"></div></div>
 <div id="po" style="margin-top:12px"></div></div>
 <div class="card"><h3 style="margin-top:0">Available fault current at the secondary (infinite primary bus)</h3>
 <div class="grid"><div class="fld"><label>Impedance %Z</label><input id="xz" type="number" step="0.05" value="3.5"></div></div>
 <p class="note">Uses the transformer above (kVA, phases, secondary voltage).</p><div id="fo" style="margin-top:8px"></div></div>`;
 const g=id=>$(id,box);
 const rate=(x,mx,list)=>({down:nextDown(mx,list),up:nextUp(mx,list)});
 const calc=()=>{
  const kva=+g('#kv').value,ph=g('#xp').value,Vp=+g('#vp').value,Vs=+g('#vs').value,z=+g('#xz').value/100;
  if(!(kva>0&&Vp>0&&Vs>0))return;
  const k=ph==='3'?SQ3:1,Ip=kva*1000/(k*Vp),Is=kva*1000/(k*Vs),f=v=>fmt(v,2);
  // primary only
  const pp=Ip>=9?1.25:Ip>=2?1.67:3,pOnlyMax=Ip*pp,pOnly=rate(Ip,pOnlyMax,CTRL);
  // both
  const pbMax=Ip*2.5,pb=nextDown(pbMax,CTRL),sp=Is>=9?1.25:1.67,sMax=Is*sp,sd=rate(Is,sMax,CTRL);
  const reflected=(pOnly.down||0)*Vp/Vs;
  g('#po').innerHTML=`<div class="grid"><div><div class="note">Primary rated current</div><div class="big">${f(Ip)} A</div></div><div><div class="note">Secondary rated current</div><div class="big">${f(Is)} A</div></div></div>
  <ol class="steps"><li><b>Currents:</b> I<sub>p</sub> = ${kva}×1000 ÷ (${ph==='3'?'1.732 × ':''}${Vp}) = ${f(Ip)} A; I<sub>s</sub> = ${kva}×1000 ÷ (${ph==='3'?'1.732 × ':''}${Vs}) = ${f(Is)} A.</li>
  <li><b>A. Primary-only protection:</b> I<sub>p</sub> ${Ip>=9?'≥ 9 A → 125 %':Ip>=2?'is 2–9 A → 167 %':'&lt; 2 A → 300 %'} → max ${f(Ip)} × ${pp} = <b>${f(pOnlyMax)} A</b> → largest standard not above: <b>${pOnly.down} A</b>${pp===1.25?`; next size up (<b>${pOnly.up} A</b>) is also permitted in the 125 % row`:'; no “next size up” permission in this row (a guide may still round to the closest size, here '+pOnly.up+' A)'}.
  <br><span class="note">Seen from the secondary, ${pOnly.down} A on the primary is ≈ ${f(reflected)} A (${f(reflected/Is*100)} % of I<sub>s</sub>)${ph==='3'?' for a balanced 3-phase load – a single-phase load on a delta–wye secondary sees ≈ 1/0.58 more, so the secondary wiring is not protected':''}.</span></li>
  <li><b>B. Primary + secondary protection:</b> primary max = 250 % × ${f(Ip)} = <b>${f(pbMax)} A</b> → <b>${pb} A</b>.<br>
  Secondary: I<sub>s</sub> ${Is>=9?'≥ 9 A → 125 %':'&lt; 9 A → 167 %'} → max ${f(Is)} × ${sp} = <b>${f(sMax)} A</b> → largest standard not above: <b>${sd.down} A</b>${sp===1.25?`; next size up (<b>${sd.up} A</b>) is also permitted`:''}.</li>
  <li><b>Rule of thumb:</b> if a protection value is <i>marked on the transformer</i> (or in the maker’s table, e.g. Eaton p. 46) use that instead.</li></ol>
  <svg viewBox="0 0 560 70" style="width:100%;max-width:640px"><line x1="8" y1="35" x2="552" y2="35" stroke="var(--ink)" stroke-width="2"/>
  <rect x="30" y="16" width="130" height="38" rx="6" fill="var(--acc2)" stroke="var(--acc)"/><text x="95" y="32" font-size="11" text-anchor="middle" font-weight="700">Primary ≤ ${pb} A (B)</text><text x="95" y="46" font-size="10" text-anchor="middle">or ≤ ${pOnly.down} A alone (A)</text>
  <circle cx="225" cy="35" r="20" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/><circle cx="253" cy="35" r="20" fill="var(--card)" stroke="var(--ink)" stroke-width="2"/>
  <rect x="320" y="16" width="130" height="38" rx="6" fill="var(--acc2)" stroke="var(--acc)"/><text x="385" y="39" font-size="11" text-anchor="middle" font-weight="700">Secondary ≤ ${sd.down} A (B)</text></svg>`;
  const fl=Is,isc=fl/z,ok=[5,10,14,18,22,25,30,35,42,50,65,85,100,200].find(x=>x*1000>=isc);
  g('#fo').innerHTML=`<ol class="steps"><li>I<sub>FL</sub> (secondary) = ${f(fl)} A</li><li>I<sub>sc</sub> = I<sub>FL</sub> ÷ %Z = ${f(fl)} ÷ ${z} = <b>${fmt(isc,0)} A = ${f(isc/1000)} kA</b></li></ol>
  <p>A panel fed from this secondary needs SCCR ≥ <b>${f(isc/1000)} kA</b> → next common rating <b>${ok||'>200'} kA</b>.</p>
  <svg viewBox="0 0 320 52" style="width:100%;max-width:420px"><rect x="0" y="14" width="320" height="16" rx="8" fill="var(--code)"/><rect x="0" y="14" width="${Math.min(isc/1000/100,1)*320}" height="16" rx="8" fill="var(--bad)"/><line x1="16" x2="16" y1="6" y2="38" stroke="var(--ink)"/><text x="20" y="49" font-size="10">5 kA default</text><text x="316" y="10" font-size="10" text-anchor="end">scale 0–100 kA</text></svg>
  <p class="note">Worst case at the transformer terminals; conductor and source impedance reduce it downstream.</p>`};
 box.oninput=calc;
 box.onclick=e=>{const b=e.target.closest('.pre');if(!b)return;const [kv,ph,vp,vs]=b.dataset.k.split(',');g('#kv').value=kv;g('#xp').value=ph;g('#vp').value=vp;g('#vs').value=vs;g('#xz').value=ph==='3'?'3.5':'3';calc()};
 calc()}

/* ============================== routing ============================== */
const VIEWS={study:['Study Questions',viewStudy],quiz:['Quiz',viewQuiz],sim:['Simulators',viewSim],ref:['Reference',viewRef]};
function go(v,sub){if(sub){simTab=sub;store.set('ul508a.sim',sub)}if(stopFn){stopFn();stopFn=null}location.hash=v;render()}
function render(){
 const v=(location.hash||'#study').slice(1);const cur=VIEWS[v]?v:'study';
 $('#nav').innerHTML=Object.entries(VIEWS).map(([k,x])=>`<button data-v="${k}" class="${k===cur?'on':''}">${x[0]}</button>`).join('');
 if(stopFn){stopFn();stopFn=null}
 VIEWS[cur][1]();window.scrollTo(0,0)}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.v)};
window.addEventListener('hashchange',render);
$('#theme').onclick=()=>{const r=document.documentElement,d=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches);r.dataset.theme=d?'light':'dark'};
updateScore();render();
</script>
