<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UL 508A MTR Exam Study Guide</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#16202c;--mut:#5b6877;--line:#d9dee5;--acc:#1f5fd1;--acc2:#e8f0fe;--ok:#14803c;--okbg:#e6f6ec;--bad:#c62828;--badbg:#fdecec;--warn:#9a6700;--warnbg:#fff6dd;--ph-a:#d63031;--ph-b:#2563eb;--ph-c:#15803d;--cur:#b7791f;--code:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1319;--card:#171e27;--ink:#e6ebf1;--mut:#9aa7b6;--line:#2a3441;--acc:#6ea0ff;--acc2:#1a2a47;--ok:#4ade80;--okbg:#10301e;--bad:#ff7b7b;--badbg:#3a1717;--warn:#f2c14e;--warnbg:#33290d;--ph-a:#ff6b6b;--ph-b:#6ea0ff;--ph-c:#4ade80;--cur:#f2c14e;--code:#222c38}}
:root[data-theme=dark]{--bg:#0e1319;--card:#171e27;--ink:#e6ebf1;--mut:#9aa7b6;--line:#2a3441;--acc:#6ea0ff;--acc2:#1a2a47;--ok:#4ade80;--okbg:#10301e;--bad:#ff7b7b;--badbg:#3a1717;--warn:#f2c14e;--warnbg:#33290d;--ph-a:#ff6b6b;--ph-b:#6ea0ff;--ph-c:#4ade80;--cur:#f2c14e;--code:#222c38}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;align-items:center;gap:12px;padding:10px 0;flex-wrap:wrap}
h1{font-size:1.15rem;margin:0;flex:1;min-width:200px}
h1 small{display:block;font-weight:400;color:var(--mut);font-size:.78rem}
nav{display:flex;gap:4px;overflow-x:auto;padding-bottom:8px}
nav button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 13px;border-radius:8px;cursor:pointer;white-space:nowrap}
nav button.on,.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn:hover,nav button:hover{border-color:var(--acc)}
.btn.sm{padding:3px 9px;font-size:.85rem}
main{padding:18px 0 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:600}
.tag.d{background:var(--code);color:var(--mut)}
.q{font-weight:600;margin:8px 0}
.ans{background:var(--okbg);border-left:4px solid var(--ok);padding:10px 12px;border-radius:6px;margin:10px 0}
.steps{background:var(--code);border-radius:8px;padding:10px 14px 10px 34px;margin:10px 0}
.steps li{margin:4px 0}
.why{background:var(--warnbg);border-left:4px solid var(--warn);padding:10px 12px;border-radius:6px;margin:10px 0}
.hide{display:none}
code,.m{font-family:ui-monospace,Menlo,Consolas,monospace;background:var(--code);padding:1px 5px;border-radius:4px;font-size:.92em}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}
input,select{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);max-width:100%}
input[type=range]{padding:0;width:200px}
label{font-size:.9rem;color:var(--mut)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.fld{display:flex;flex-direction:column;gap:3px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}
th{background:var(--code)}
.tbl{overflow-x:auto}
.note{font-size:.85rem;color:var(--mut)}
.banner{background:var(--warnbg);border:1px solid var(--warn);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:.88rem;margin-bottom:14px}
svg text{fill:var(--ink);font-family:system-ui,sans-serif}
.big{font-size:1.5rem;font-weight:700}
.pill{padding:6px 12px;border-radius:8px;font-weight:700;display:inline-block}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.bad{background:var(--badbg);color:var(--bad)}
canvas{width:100%;display:block;background:var(--card);border:1px solid var(--line);border-radius:8px}
.prog{height:8px;background:var(--code);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.sub{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.sub button{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:99px;cursor:pointer}
.sub button.on{background:var(--acc2);border-color:var(--acc);color:var(--acc);font-weight:600}
@media(max-width:560px){body{font-size:15px}.card{padding:12px}}
</style>

<body>
<header><div class="wrap">
 <div class="top"><h1>UL 508A MTR Exam Study Guide<small>Industrial Control Panels · Manufacturer Technical Representative</small></h1>
  <span id="score" class="note"></span>
  <button class="btn sm" id="theme" title="Toggle dark / light">◐</button></div>
 <nav id="nav"></nav>

<main class="wrap" id="main"></main>

<script>
'use strict';
/* ============================== helpers ============================== */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const fmt=(x,d=2)=>Number(x).toLocaleString('en-US',{maximumFractionDigits:d});
const SQ3=Math.sqrt(3);
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ============================== reference data ============================== */
// NEC Table 430.250 (3-phase) – UL 508A Table 50.1 uses the same values
const FLC3={
 208:{0.5:2.4,0.75:3.5,1:4.6,1.5:6.6,2:7.5,3:10.6,5:16.7,7.5:24.2,10:30.8,15:46.2,20:59.4,25:74.8,30:88,40:114,50:143,60:169,75:211,100:273},
 230:{0.5:2.2,0.75:3.2,1:4.2,1.5:6,2:6.8,3:9.6,5:15.2,7.5:22,10:28,15:42,20:54,25:68,30:80,40:104,50:130,60:154,75:192,100:248},
 460:{0.5:1.1,0.75:1.6,1:2.1,1.5:3,2:3.4,3:4.8,5:7.6,7.5:11,10:14,15:21,20:27,25:34,30:40,40:52,50:65,60:77,75:96,100:124},
 575:{0.5:0.9,0.75:1.3,1:1.7,1.5:2.4,2:2.7,3:3.9,5:6.1,7.5:9,10:11,15:17,20:22,25:27,30:32,40:41,50:52,60:62,75:77,100:99}};
// NEC Table 430.248 (single-phase)
const FLC1={
 115:{0.5:9.8,0.75:13.8,1:16,1.5:20,2:24,3:34,5:56,7.5:80,10:100},
 230:{0.5:4.9,0.75:6.9,1:8,1.5:10,2:12,3:17,5:28,7.5:40,10:50}};
const STD=[1,3,6,10,15,20,25,30,35,40,45,50,60,70,80,90,100,110,125,150,175,200,225,250,300,350,400,450,500,600,700,800,1000,1200];
const CTRL=[0.5,0.6,0.8,1,1.25,1.5,1.6,2,2.5,3,3.5,4,5,6,7,8,10,12,13,15,17.5,20,25,30,35,40,45,50,60,70,80,90,100,110,125,150,175,200,225,250,300,350,400,450,500,600,700,800,1000,1200];
const STDCB=STD.filter(x=>x>=15);
const W60=[['14',15],['12',20],['10',30],['8',40],['6',55],['4',70],['3',85],['2',95],['1',110],['1/0',125],['2/0',145],['3/0',165],['4/0',195]];
const W75=[['14',20],['12',25],['10',35],['8',50],['6',65],['4',85],['3',100],['2',115],['1',130],['1/0',150],['2/0',175],['3/0',200],['4/0',230]];
const nextUp=(x,list=STD)=>list.find(v=>v>=x-1e-9)||null;
const nextDown=(x,list=STD)=>[...list].reverse().find(v=>v<=x+1e-9)||null;
const wireFor=(amps,isHigh)=>{const t=(isHigh?W75:W60).find(w=>w[1]>=amps-1e-9);return t?t[0]:'larger than 4/0'};

/* ============================== questions ============================== */
const TOPICS={scope:'Scope & Marking',motor:'Motor Circuits',sccr:'SCCR & Fault Current',xfmr:'Transformers (Power & Control)',upsize:'Sizing Up & Feeders',xcur:'Transformer Current (Single- & 3-Phase)',wire:'Conductors & Grounding',math:'Electrical Math',ctrl:'Controls & Protection'};
const SRC_L='Larson Electronics, “How to Calculate Transformer Primary and Secondary Current” (Jan 8, 2026)';
const SRC_I='Industrial Monitor Direct, “480V to 120V Transformer Ampacity Calculation for Test Stations” (Apr 13, 2026)';
const T450='<div class="tbl"><table><tr><th>Protection method</th><th>Primary device max</th><th>Secondary device max</th></tr><tr><td rowspan="3">Primary only</td><td>I<sub>p</sub> ≥ 9 A: <b>125 %</b> (next std size up allowed)</td><td>none required by the table</td></tr><tr><td>2 A ≤ I<sub>p</sub> &lt; 9 A: <b>167 %</b></td><td>–</td></tr><tr><td>I<sub>p</sub> &lt; 2 A: <b>300 %</b></td><td>–</td></tr><tr><td rowspan="2">Primary + secondary</td><td><b>250 %</b></td><td>I<sub>s</sub> ≥ 9 A: <b>125 %</b> (next std size up allowed)</td></tr><tr><td><b>250 %</b></td><td>I<sub>s</sub> &lt; 9 A: <b>167 %</b></td></tr></table></div>';
const Q=[
/* ---------- SCOPE ---------- */
{id:'scope-1',t:'scope',d:1,q:'What is the difference between UL 508 and UL 508A?',
 a:'<b>UL 508</b> covers industrial control <i>equipment</i> (individual components: contactors, starters, switches, relays, etc.). <b>UL 508A</b> covers industrial control <i>panels</i> – assemblies built from those components.',
 why:'A panel shop is evaluated against UL 508A. The components inside are evaluated to their own standards (UL 508, UL 489, UL 248, UL 1077 …). A panel is only as acceptable as its parts: every power-circuit part must be Listed/Recognized for the use.'},
{id:'scope-2',t:'scope',d:1,q:'What does UL 508A cover, and what is outside its scope?',
 a:'Covers <b>industrial control panels for general industrial use, 1000 V or less (typically ≤ 600 V), in ordinary (non-hazardous) locations</b>, intended to control other equipment (power + control circuits, enclosure, disconnect, protection).<br>Outside scope: panels for <b>hazardous (classified) locations</b> (see UL 698A), and special-purpose panels with their own standard (e.g. HVAC, elevators, marine, etc.).',
 why:'Industrial control panels are an NEC Article 409 product. UL 508A is the product standard that lets the panel be Listed and field-accepted by the AHJ.'},
{id:'scope-3',t:'scope',d:2,q:'List the main markings required on a UL 508A industrial control panel nameplate.',
 a:'<ul><li>Manufacturer name / trademark</li><li>Supply <b>voltage, phases, frequency</b></li><li><b>Full-load current</b> rating (total) and <b>FLC of the largest motor</b></li><li><b>Short-circuit current rating (SCCR)</b></li><li><b>Enclosure type</b></li><li><b>Wiring diagram number</b> / schematic reference</li><li>Date or serial / file number; “Industrial Control Panel” (UL Listing mark when listed)</li></ul>',
 why:'The nameplate lets the installer size supply conductors, feeder protection and verify SCCR ≥ available fault current (NEC 409.110, 409.22). <span class="note">Check the exact marking clause in your edition.</span>'},
{id:'scope-4',t:'scope',d:2,q:'What is the difference between a <i>Listed</i> and a <i>Recognized</i> component, and where may each be used?',
 a:'<b>Listed</b> – evaluated for the end use by itself; may be used on its own (e.g. a UL 489 circuit breaker used as branch-circuit protection).<br><b>Recognized</b> – evaluated for use <i>as a part</i> of another product only, with <b>conditions of acceptability</b>; must be used inside the panel and meet those conditions (e.g. a Recognized terminal block, power supply).',
 why:'Recognized components often must be installed where they are not exposed to user contact, or need specific enclosures/branch protection. Always read the conditions of acceptability.'},
{id:'scope-5',t:'scope',d:2,q:'Match the enclosure type: (a) Type 1  (b) Type 3R  (c) Type 4  (d) Type 4X  (e) Type 12  (f) Type 13',
 a:'<b>1</b> – indoor, protects against contact with enclosed equipment &amp; falling dirt.<br><b>3R</b> – outdoor, rain, sleet, ice formation (not watertight).<br><b>4</b> – indoor/outdoor, windblown dust, splashing &amp; hose-directed water.<br><b>4X</b> – same as 4 + <b>corrosion</b> resistance.<br><b>12</b> – indoor, dust, dripping non-corrosive liquids, falling dirt.<br><b>13</b> – indoor, dust, spraying water, <b>oil and non-corrosive coolant</b>.',
 why:'Enclosure type is one of the markings. The enclosure type chosen by the panel shop must be at least what the environment requires.'},
{id:'scope-6',t:'scope',d:2,q:'In UL 508A, what is a <i>power circuit</i> versus a <i>control circuit</i>, and why does it matter?',
 a:'<b>Power circuit</b> – carries the main load current (supply, disconnect, branch protection, motor controllers, motors, heaters). <b>Control circuit</b> – carries signals that control the power circuit (coils, pilot devices, PLC I/O).<br>It matters because <b>SCCR is determined from the power circuit components</b> and branch-circuit rules apply to power circuits; control circuits have their own protection and wiring rules.',
 why:'Many SCCR errors come from forgetting a power component (terminal block, PDB, fuseholder) that has a low default SCCR.'},
/* ---------- MOTOR ---------- */
{id:'motor-1',t:'motor',d:1,q:'What is the full-load current (FLC) to use for sizing the branch circuit of a <b>10 hp, 460 V, 3-phase</b> motor whose nameplate reads 13.2 A?',
 num:{v:14,tol:0.01,u:'A'},
 a:'<b>14 A</b> – taken from the table, <u>not</u> the nameplate.',
 steps:['Branch-circuit conductors and short-circuit/ground-fault protection are sized from the <b>table FLC</b> (NEC 430.250, same values as UL 508A Table 50.1).','Table, 3-phase, 460 V, 10 hp → <code>14 A</code>.','The <b>nameplate current (13.2 A)</b> is only used to size/set the <b>overload protection</b>.'],
 why:'Using table values makes branch-circuit sizing independent of which manufacturer’s motor is installed later.',fig:'pct'},
{id:'motor-2',t:'motor',d:2,q:'Minimum branch-circuit conductor ampacity for a <b>25 hp, 460 V, 3-phase</b> motor, and the smallest copper wire (60 °C column)?',
 num:{v:42.5,tol:0.01,u:'A'},
 a:'Required ampacity <b>42.5 A</b> → <b>6 AWG</b> copper (55 A at 60 °C).',
 steps:['Table FLC, 25 hp @ 460 V 3φ = <code>34 A</code>.','Conductors must carry <b>125 %</b> of motor FLC: <code>34 × 1.25 = 42.5 A</code>.','Circuits ≤ 100 A use the <b>60 °C</b> ampacity column: 8 AWG = 40 A (too small), 6 AWG = 55 A ✔.'],
 why:'125 % covers the continuous nature of motor duty. Using the 75 °C column would allow 8 AWG (50 A) only if every termination is rated 75 °C <i>and</i> the rule allows it – exam questions normally expect 60 °C for ≤ 100 A.',sim:'motor'},
{id:'motor-3',t:'motor',d:2,q:'Maximum rating of an <b>inverse-time circuit breaker</b> for short-circuit &amp; ground-fault protection of a <b>15 hp, 460 V, 3-phase</b> motor?',
 num:{v:60,tol:0.001,u:'A'},
 a:'<b>60 A</b>.',
 steps:['FLC (table) 15 hp @ 460 V = <code>21 A</code>.','Inverse-time breaker max = <b>250 %</b> of FLC: <code>21 × 2.50 = 52.5 A</code>.','52.5 A is not a standard size; the <b>next higher standard size</b> is permitted → standard sizes …50, <b>60</b> → <code>60 A</code>.'],
 why:'The “next size up” exception (NEC 430.52(C)(1) Exc. 1) applies to motor branch-circuit protection – a key difference from feeders, where you go <i>down</i> (see next questions).',fig:'pct',sim:'motor'},
{id:'motor-4',t:'motor',d:2,q:'Maximum <b>dual-element (time-delay) fuse</b> for the same 15 hp, 460 V, 3-phase motor (FLC 21 A)?',
 num:{v:40,tol:0.001,u:'A'},
 a:'<b>40 A</b>.',
 steps:['Dual-element fuse max = <b>175 %</b> of FLC.','<code>21 × 1.75 = 36.75 A</code>.','Next higher standard size → <code>40 A</code> (30 A is the next lower).'],
 why:'Rule of thumb % of FLC (max): <b>inverse-time CB 250 %</b>, <b>dual-element fuse 175 %</b>, <b>non-time-delay fuse 300 %</b>, <b>instantaneous-trip CB (MCP) 800 %</b>.'},
{id:'motor-5',t:'motor',d:2,q:'A motor nameplate reads <b>13.5 A</b>, service factor <b>1.15</b>. What is the maximum overload relay trip setting (normal case)?',
 num:{v:16.9,tol:0.01,u:'A'},
 a:'<b>≈ 16.9 A</b> (125 % of nameplate).',
 steps:['Overloads are based on <b>nameplate</b> current.','SF ≥ 1.15 (or temperature rise ≤ 40 °C) → <b>125 %</b>; otherwise <b>115 %</b>.','<code>13.5 × 1.25 = 16.875 ≈ 16.9 A</code>.','If that setting won’t carry the starting current, it may be raised to <b>140 %</b> (SF ≥ 1.15) or <b>130 %</b> (others): <code>13.5 × 1.40 = 18.9 A</code>.'],
 why:'The branch device handles short circuits; the overload relay handles sustained overcurrent. They protect different things, which is why each uses a different current basis (table vs. nameplate).'},
{id:'motor-6',t:'motor',d:3,q:'Two motors share one feeder at 460 V 3φ: <b>10 hp</b> (FLC 14 A) and <b>5 hp</b> (FLC 7.6 A). What minimum feeder ampacity is required?',
 num:{v:25.1,tol:0.01,u:'A'},
 a:'<b>25.1 A</b> → 10 AWG copper (30 A @ 60 °C).',
 steps:['125 % of the <b>largest</b> motor: <code>14 × 1.25 = 17.5 A</code>.','Plus 100 % of the others: <code>+ 7.6 A</code>.','Total <code>17.5 + 7.6 = 25.1 A</code>.','60 °C column: 12 AWG = 20 A (too small), <b>10 AWG = 30 A</b> ✔.'],
 why:'Only the largest motor gets the 125 % factor.'},
{id:'motor-7',t:'motor',d:3,q:'Same feeder as above (10 hp + 5 hp @ 460 V, inverse-time breakers on each branch). What is the <b>maximum feeder breaker</b> rating?',
 num:{v:40,tol:0.001,u:'A'},
 a:'<b>40 A</b>.',
 steps:['Largest branch breaker (10 hp): <code>14 × 2.5 = 35 A</code> → 35 A is a standard size.','Feeder max = largest branch device + sum of the other FLCs: <code>35 + 7.6 = 42.6 A</code>.','42.6 A is not a standard size. Nearest standard size and the largest one not above it are both <code>40 A</code> (45 A would exceed the computed value).'],
 why:'Branch circuit: the “next size up” rule applies to the % calculation. Feeder (NEC 430.62): do not exceed the computed value. The Eaton guide says “closest standard size” (its example 172 A → 175 A rounds up because 175 is the closest). Here both methods give 40 A. See the feeder question in <i>Sizing Up &amp; Feeders</i>.'},
{id:'motor-8',t:'motor',d:3,q:'The 250 % inverse-time breaker you chose trips when the motor starts. By how much may the rating be increased?',
 a:'(See also the <i>Sizing Up &amp; Feeders</i> topic.) Inverse-time CB: up to <b>400 %</b> of FLC if FLC ≤ 100 A, <b>300 %</b> if FLC > 100 A.<br>Other limits: non-time-delay fuse (≤ 600 A) 400 %; dual-element fuse 225 %.',
 why:'Only allowed when the standard maximum will not let the motor start. Overload protection must still be set per its own rules. <span class="note">(NEC 430.52(C)(1) Exception 2 – verify against your reference edition.)</span>'},
{id:'motor-9',t:'motor',d:1,q:'What is the FLC for a <b>3 hp, 115 V, single-phase</b> motor and what table is used?',
 num:{v:34,tol:0.01,u:'A'},
 a:'<b>34 A</b>, from the <b>single-phase</b> table (NEC 430.248 / UL 508A Table 50.2).',
 steps:['Single-phase motors use a different table than 3-phase.','115 V column, 3 hp → <code>34 A</code>.','Conductor: <code>34 × 1.25 = 42.5 A</code> → 6 AWG (60 °C).']},
/* ---------- SCCR ---------- */
{id:'sccr-1',t:'sccr',d:2,q:'A panel has these power-circuit parts, all with <u>no marked SCCR</u>: bus bar (50 kA default), fuse holders (10 kA), terminal blocks (10 kA), a disconnect switch (5 kA), a motor starter with overload (5 kA). What is the panel SCCR?',
 num:{v:5,tol:0.001,u:'kA'},
 a:'<b>5 kA</b> – the lowest component rating (“weakest link”).',
 steps:['List every <b>power-circuit</b> component and its SCCR (marked, else the default value from the standard’s Supplement SB table).','Panel SCCR = <b>lowest</b> component SCCR (unless a current-limiting device or tested combination raises it).','Lowest = 5 kA (disconnect, starter).'],
 why:'Default SCCR values (Supplement SB, Table SB4.1): bus bar 50 kA · fuse holder 10 kA · terminal block / power-distribution block 10 kA · circuit breaker 5 kA · switch 5 kA · motor controller 5 kA · overload relay 5 kA. <span class="note">Verify in your edition.</span>',fig:'bars1',sim:'sccr'},
{id:'sccr-2',t:'sccr',d:3,q:'To raise the panel above, the starter/overload and disconnect are replaced by a <b>tested combination rated 65 kA</b> with Class J fuses (200 kA IR). What is the new panel SCCR?',
 num:{v:10,tol:0.001,u:'kA'},
 a:'<b>10 kA</b> – now limited by the fuse holders and terminal blocks.',
 steps:['Combination (65 kA) and fuses (200 kA) and bus bar (50 kA) are no longer limiting.','Remaining lowest: fuse holders and terminal blocks = <code>10 kA</code>.','To go higher: use higher-rated (marked) fuse holders and terminal blocks, or place a current-limiting device upstream.'],
 why:'Keep removing the weakest link until the required rating is reached – that is exactly how panel shops “upgrade” SCCR.',fig:'bars2',sim:'sccr'},
{id:'sccr-3',t:'sccr',d:2,q:'Available fault current at a <b>150 kVA, 480 V, 3-phase</b> transformer secondary with <b>3.5 % impedance</b> (infinite primary)? Is a 5 kA panel acceptable there?',
 num:{v:5.155,tol:0.02,u:'kA'},
 a:'<b>≈ 5.16 kA</b>. A 5 kA-rated panel is <span class="bad">NOT</span> acceptable (5.16 > 5).',
 steps:['Secondary full-load current: <code>I<sub>FL</sub> = kVA×1000 / (√3 × V) = 150 000 / (1.732 × 480) = 180.4 A</code>.','Fault current: <code>I<sub>sc</sub> = I<sub>FL</sub> / %Z = 180.4 / 0.035 = 5 155 A ≈ 5.16 kA</code>.','Panel SCCR (5 kA) must be ≥ available fault current (5.16 kA) → <b>fails</b>.'],
 why:'NEC 409.22 requires the panel SCCR to be at least the available fault current at its line terminals. This is the “infinite bus” (worst-case) calculation; real upstream impedance lowers it.',sim:'xfmr'},
{id:'sccr-4',t:'sccr',d:3,q:'Available fault current at a <b>75 kVA, 208 V, 3-phase</b> transformer with <b>2.5 %</b> impedance?',
 num:{v:8.33,tol:0.02,u:'kA'},
 a:'<b>≈ 8.33 kA</b>.',
 steps:['<code>I<sub>FL</sub> = 75 000 / (1.732 × 208) = 208.2 A</code>.','<code>I<sub>sc</sub> = 208.2 / 0.025 = 8 327 A ≈ 8.33 kA</code>.'],
 why:'Low-voltage secondaries carry more current per kVA, so fault current is high even on small transformers.',sim:'xfmr'},
{id:'sccr-5',t:'sccr',d:3,q:'Same 150 kVA / 480 V transformer, but with a <b>low-impedance 1.75 %</b> unit. New available fault current?',
 num:{v:10.31,tol:0.02,u:'kA'},
 a:'<b>≈ 10.3 kA</b> – halving %Z doubles the fault current.',
 steps:['<code>I<sub>FL</sub> = 180.4 A</code> (unchanged).','<code>I<sub>sc</sub> = 180.4 / 0.0175 = 10 309 A ≈ 10.3 kA</code>.'],
 why:'Fault current is inversely proportional to impedance. A 5 kA panel is now far too low; you need ≥ 10.3 kA, practically a 14 kA, 18 kA or higher-rated panel.',sim:'xfmr'},
{id:'sccr-6',t:'sccr',d:2,q:'What does the SCCR marking on the panel mean and who must compare it with what?',
 a:'SCCR is the <b>maximum available fault current</b> the panel can safely withstand. The installer/designer must verify <b>panel SCCR ≥ available fault current at the point of installation</b> (NEC 409.22, 110.10).',
 why:'SCCR is not the same as the interrupting rating of one device; it is the rating of the <i>whole assembly</i> (lowest power-circuit component, modified by current-limiting protection or tested combinations).'},
{id:'sccr-7',t:'sccr',d:3,q:'How can a current-limiting device (e.g. Class J or CC fuse) increase panel SCCR?',
 a:'A listed current-limiting device limits the <b>peak let-through current and I²t</b> to downstream parts. Downstream components that are tested/marked for use with that device (a <b>combination rating</b> in the manufacturer’s tables) may be assigned the higher rating, so the downstream weak links no longer limit the panel.',
 why:'The device itself must also have an interrupting rating ≥ the available fault current. Use only <b>manufacturer-published</b> combination ratings or the let-through tables in Supplement SB.'},
/* ---------- TRANSFORMERS (power + control) ---------- */
{id:'xfmr-1',t:'xfmr',d:2,q:'<b>Control transformer</b>, 500 VA, 480 V primary → 120 V secondary. If you protect <u>only the primary</u>, what is the primary current and the maximum primary fuse?',
 num:{v:1.04,tol:0.02,u:'A'},fig:'xf1',sim:'xfmr',
 a:'Primary current <b>1.04 A</b> (below 2 A) → limit <b>300 %</b> = 3.125 A → use a <b>3 A time-delay fuse</b>.',
 steps:['<b>Step 1 – primary full-load current:</b> <code>I<sub>p</sub> = VA ÷ V<sub>p</sub> = 500 ÷ 480 = 1.04 A</code>.','<b>Step 2 – pick the row of the rule table</b> (below): primary-only protection and I<sub>p</sub> &lt; 2 A → <b>300 %</b>.','<b>Step 3 – maximum rating:</b> <code>1.04 × 3.00 = 3.125 A</code>.','<b>Step 4 – standard size:</b> available fuse sizes around it are 2.5 A, 3 A, 3.5 A → the largest one that does not exceed 3.125 A is <code>3 A</code>.','<b>Step 5 – sanity check:</b> seen from the 120 V side the 3 A fuse is <code>3 × (480÷120) = 12 A</code>, i.e. 12 ÷ 4.17 = 288 % of the secondary rating. That is allowed for the transformer, but it means this fuse does <u>not</u> protect the secondary wiring against overload.'],
 why:'<b>Why the percentage rises as the current falls:</b> a transformer magnetising inrush is typically 8–12× rated current for a fraction of a second, and for a tiny transformer that is a big number compared to a standard fuse size. A 125 % fuse would blow every time the panel is energised, so the rules allow 167 % (2–9 A) and 300 % (&lt; 2 A).<br><b>Rule table (NEC 450.3(B), 1000 V or less – the rule UL 508A relies on):</b>'+T450+'<span class="note">“Next size up” is explicitly permitted only in the 125 % rows. Always follow a protection rating that is <i>marked on the transformer</i> if it is lower.</span>'},
{id:'xfmr-2',t:'xfmr',d:2,q:'Same 500 VA, 480/120 V control transformer, but now protected on <b>both</b> the primary and the secondary. What is the maximum secondary device and the maximum primary device?',
 num:{v:6.96,tol:0.02,u:'A'},fig:'xf2',sim:'xfmr',
 a:'Secondary: 4.17 A (&lt; 9 A) × 167 % = <b>6.96 A → 6 A</b>.<br>Primary: 1.04 A × 250 % = <b>2.6 A → 2.5 A</b> (time-delay).',
 steps:['<code>I<sub>s</sub> = 500 ÷ 120 = 4.17 A</code> and <code>I<sub>p</sub> = 500 ÷ 480 = 1.04 A</code>.','<b>Secondary</b> (second row of the table): I<sub>s</sub> &lt; 9 A → 167 % → <code>4.17 × 1.67 = 6.96 A</code> → largest standard size not above it: <code>6 A</code>.','<b>Primary</b> when the secondary is protected: <b>250 %</b> → <code>1.04 × 2.50 = 2.6 A</code> → <code>2.5 A</code>.','Compare with primary-only protection (previous question: 3 A). The primary device is actually <i>smaller</i>, because now only inrush and primary faults have to be handled by it.'],
 why:'<b>Division of labour:</b> the <b>secondary</b> device is the transformer’s overload protection (and protects the secondary wiring); the <b>primary</b> device only needs to ride through inrush and clear primary-side/transformer faults, so it may be up to 250 %. For secondary current ≥ 9 A use 125 % (next size up allowed) instead of 167 %.'},
{id:'xfmr-3',t:'xfmr',d:2,q:'In the Eaton guide’s example panel the control transformer’s <b>primary load is 1.95 A</b> and it is protected by a <b>6 A fuse</b>. Where does 6 A come from?',
 num:{v:5.85,tol:0.01,u:'A'},sim:'xfmr',
 a:'Primary current is below 2 A → <b>300 %</b> rule: <code>1.95 × 3 = 5.85 A</code> → <b>6 A fuse</b> (the guide uses the closest standard size).',
 steps:['I<sub>p</sub> = 1.95 A &lt; 2 A → primary-only protection may be up to <b>300 %</b>.','<code>1.95 × 3.00 = 5.85 A</code>.','Closest standard size: <code>6 A</code> (a 5 A fuse also exists and would be fully inside the limit).','This 1.95 A primary load is also <u>added into the feeder calculation</u> (see the feeder question).'],
 why:'The guide rounds to the closest standard rating (5.85 → 6 A). Strictly by the “shall not exceed” wording a 5 A fuse is the safe pick when it exists. If an exam offers both, the guide’s method (6 A) is what the guide teaches – know both.'},
{id:'xfmr-4',t:'xfmr',d:3,q:'Eaton’s control-transformer table (480/120 V, p. 46) lists for a <b>3 kVA</b> unit: primary 6.25 A, secondary 25 A, max primary protection <b>15 A</b>, max secondary protection <b>30 A</b>. Verify those numbers and say which protection method the table assumes.',
 num:{v:15.6,tol:0.01,u:'A'},sim:'xfmr',
 a:'The table assumes <b>primary + secondary protection</b>: primary 250 % × 6.25 = 15.6 → <b>15 A</b>; secondary 125 % × 25 = 31.25 → <b>30 A</b> (the table rounds <u>down</u>).',
 steps:['<code>I<sub>p</sub> = 3000 ÷ 480 = 6.25 A</code>; <code>I<sub>s</sub> = 3000 ÷ 120 = 25 A</code>.','Primary with secondary protection: <code>6.25 × 2.50 = 15.6 A → 15 A</code> ✔.','Secondary ≥ 9 A: <code>25 × 1.25 = 31.25 A → 30 A</code> ✔ (35 A would be allowed by the “next size up” rule, but the manufacturer lists 30 A).','Second check, 1 kVA row: I<sub>p</sub> 2.08 A → ×2.5 = 5.2 → <b>5 A</b> ✔; I<sub>s</sub> 8.33 A (&lt; 9 A) → ×1.67 = 13.9 → <b>13 A</b> ✔.'],
 why:'When a transformer’s maximum protection is given by the manufacturer (nameplate, data sheet), <b>use that value</b> – it is the Listed condition. Notice that the primary value is much higher than 125 % and the secondary value is close to 125 %: that is the signature of the “primary + secondary” row.'},
{id:'xfmr-5',t:'xfmr',d:3,q:'Size the control transformer: 3 contactor coils (10 VA sealed, 100 VA inrush each), 3 relays (2 VA each), 4 pilot lights (3 W each). Only one coil pulls in at a time.',
 num:{v:138,tol:0.01,u:'VA'},
 a:'Peak load <b>≈ 138 VA</b> → choose <b>150 VA</b> (or the next size up, e.g. 250 VA, for spare capacity and voltage regulation).',
 steps:['Sealed (steady) load: coils <code>3×10 = 30</code> + relays <code>3×2 = 6</code> + lights <code>4×3 = 12</code> → <code>48 VA</code>.','When one coil closes its load rises from 10 VA to 100 VA: extra <code>100 − 10 = 90 VA</code>.','Peak = <code>48 + 90 = 138 VA</code>.','Choose the next standard transformer size (150 VA).'],
 why:'Sealed VA decides heating; inrush VA decides voltage dip (coils chatter if the secondary sags). <span class="note">Practical design rule – not a code requirement.</span>'},
{id:'xfmr-6',t:'xfmr',d:2,q:'What type of fuse characteristic should protect the <b>primary of a control transformer</b>, and why not a fast-acting fuse?',
 a:'A <b>time-delay (slow-blow) fuse</b> – e.g. Class CC time-delay or supplementary time-delay fuses (FNQ-type) listed for “motor control transformers / circuits with in-rush currents”. A fast-acting fuse (KTK/KLM-type, for “control circuits, lighting, meters”) would open on the magnetising inrush.',
 why:'Eaton’s overview (p. 50) lists fast-acting fuses for control, lighting and meter circuits, and time-delay fuses for circuits with in-rush such as motor/transformer loads. Also remember the branch-circuit vs supplementary distinction: supplementary (UL 248-14) fuses may only be used downstream of a branch-circuit device; Class CC (UL 248-4) is branch-circuit rated.'},
{id:'xfmr-7',t:'xfmr',d:3,q:'<b>Power transformer</b>: 75 kVA, 480 V 3-phase primary → 208Y/120 V secondary, protected on the <u>primary only</u>. Find the rated primary and secondary currents and the maximum primary device.',
 num:{v:112.8,tol:0.01,u:'A'},sim:'xfmr',fig:'xf1',
 a:'I<sub>p</sub> = <b>90.2 A</b>, I<sub>s</sub> = <b>208.2 A</b>. Primary-only maximum 125 % = <b>112.8 A → 125 A</b> (next standard size up is permitted in the 125 % row).',
 steps:['<code>I<sub>p</sub> = kVA×1000 ÷ (√3 × V<sub>p</sub>) = 75 000 ÷ (1.732 × 480) = 90.2 A</code>.','<code>I<sub>s</sub> = 75 000 ÷ (1.732 × 208) = 208.2 A</code>.','I<sub>p</sub> ≥ 9 A, primary only → <b>125 %</b>: <code>90.2 × 1.25 = 112.8 A</code>.','112.8 A is not a standard rating; the next higher standard rating is <code>125 A</code> (110 A is also allowed).'],
 why:'This is the quickest way to protect a power transformer, but see the next two questions: with a 3-phase delta–wye transformer a primary-only device does not protect the secondary wiring or single-phase overloads, so a secondary device is normally added.'},
{id:'xfmr-8',t:'xfmr',d:3,q:'Same 75 kVA, 480 → 208Y/120 V power transformer, now protected on <b>primary and secondary</b>. Find the maximum secondary device and the maximum primary device.',
 num:{v:260.2,tol:0.01,u:'A'},sim:'xfmr',fig:'xf2',
 a:'Secondary: 208.2 A × 125 % = <b>260.2 A → 300 A</b> (next size up allowed; 250 A also acceptable).<br>Primary: 90.2 A × 250 % = <b>225.5 A → 225 A</b> (round down).',
 steps:['I<sub>s</sub> = 208.2 A (≥ 9 A) → 125 %: <code>208.2 × 1.25 = 260.2 A</code>.','260.2 A is not standard → “next higher standard size” permitted for the 125 % row: standard sizes are 250, <b>300</b> → <code>300 A</code> maximum.','Primary with secondary protection: <code>90.2 × 2.50 = 225.5 A</code> → there is no “round up” permission in the 250 % row → largest standard not above: <code>225 A</code>.','Compare to primary-only (125 A): with a secondary device the primary breaker is allowed to be <i>bigger</i> (225 A) – the secondary one does the overload protection.'],
 why:'Typical practical choice: secondary 250 A (≤ 125 %, also matches the secondary conductor ampacity) and primary 150 A–225 A. Conductors on the secondary must be protected too – see the next question.'},
{id:'xfmr-9',t:'xfmr',d:3,q:'Why is <b>primary-only</b> protection often not enough for a <b>delta–wye</b> power transformer? Use the 75 kVA 480 → 208Y/120 V example with a 125 A primary device.',
 num:{v:500,tol:0.02,u:'A'},sim:'xfmr',
 a:'A single-phase (line-to-neutral) overload on the secondary shows up on the primary at only <b>58 %</b> of the equivalent 3-phase value, so a 125 A primary device would not open until one secondary phase carries about <b>500 A</b> – far above the 208 A rating of the transformer and the secondary wiring.',
 steps:['Balanced 3-phase: primary line current = secondary line current × (208 ÷ 480) → a 125 A primary device trips at <code>125 × 480 ÷ 208 = 288 A</code> on the secondary.','One secondary phase loaded line-to-neutral (120 V): the delta winding turns ratio is 480 : 120 = 4 : 1, so primary current = secondary ÷ 4 → the 125 A device trips only at <code>125 × 4 = 500 A</code>.','Ratio: <code>288 ÷ 500 ≈ 0.58</code> (the “58 % rule” for delta–wye single-phase faults/overloads).','So one phase could run at 500 A on a 208 A transformer rating and on conductors sized for ~208–260 A without the primary device ever opening.'],
 why:'<b>Therefore:</b> add a secondary overcurrent device (≤ 125 % of I<sub>s</sub>, next size up permitted) and/or size the secondary conductors for the primary-device-reflected current. The secondary device also protects the secondary conductors. <span class="note">Concept per NEC 450.3(B) / 240.21(C); check the exact secondary-conductor protection clause your exam references.</span>'},
{id:'xfmr-10',t:'xfmr',d:3,q:'Control wiring is <b>tapped from the load side of a branch circuit</b> (power voltage = control voltage, <u>no CPT</u>) and protected only by that branch device. For 14 AWG and 18 AWG control conductors, what is the maximum branch device rating (a) inside the panel and (b) for remote control wiring? (Eaton guide p. 69 / UL 508A Table 66.5)',
 a:'<b>14 AWG</b>: (a) 80 A in the panel, (b) 60 A remote.<br><b>18 AWG</b>: (a) 25 A in the panel, (b) 20 A remote.<br>(16 AWG: 40 A / 20 A. Larger than 14 AWG: 400 % / 300 % of the wire ampacity.)',
 steps:['Find the conductor size in the first column of the table.','Use the <b>“Branch circuit overcurrent device”</b> column set because there is no separate control-circuit fuse – the branch device is the only protection.','Choose the sub-column: <i>control in wire panel</i> (higher) or <i>remote control</i> (lower, because the wiring leaves the panel).','If a separate control-circuit device is installed instead: 14, 16, 18 AWG → 20 A; larger than 14 AWG → equal to the wire ampacity.'],
 why:'These values are much higher than normal ampacity because the control conductors carry only small coil/PLC currents and are mostly protected by the short length/enclosure. With a <b>CPT</b> the secondary is a separate circuit and is protected as in the transformer questions above.'},
/* ---------- SIZING UP / FEEDERS ---------- */
{id:'up-1',t:'upsize',d:2,q:'List <b>all the situations</b> in which a motor branch-circuit protective device may be sized <u>up</u> from the basic percentage, and the limits on doing so.',
 a:'<ol><li><b>Next standard size up</b> – if the % calculation lands between standard ratings (e.g. 52.5 A → 60 A).</li><li><b>Motor will not start</b> – higher % allowed: inverse-time CB 400 % (FLC ≤ 100 A) / 300 % (&gt; 100 A); time-delay fuse 225 %; non-time-delay fuse (≤ 600 A) 400 %.</li><li><b>Instantaneous-trip breaker (MCP)</b> – 800 % may be raised to 1300 % (1700 % for Design B energy-efficient motors).</li><li><b>Group motor</b> – largest-motor % <u>plus</u> the FLC of the other motors.</li><li><b>Shared with a control transformer</b> – add the CPT primary current to the motor value (Eaton p. 68).</li><li><b>Heater loads</b> – at least 125 % of load (round up), max 60 A.</li></ol>',
 steps:['Start with the basic %: inverse-time CB 250 %, time-delay fuse 175 %, non-time-delay/CC 300 %, MCP 800 %, self-protected (Type E/F) 100 %.','Round <u>up</u> to the next standard size if allowed.','If the motor still trips on starting → apply the higher “will not start” %.','<b>Then check the caps</b> (next point).'],
 why:'<b>Limits you may never exceed:</b> (1) the <b>maximum fuse/breaker marked on the controller, overload relay, MMC or “group installation” marking</b>; (2) the type/class of fuse named in a marking; (3) the SCCR or combination rating (using a bigger device may void it); (4) feeder devices follow the “largest branch + other loads” formula, not the motor %.'},
{id:'up-2',t:'upsize',d:3,q:'A <b>60 hp, 460 V, 3-phase</b> motor (table FLC 77 A) on an inverse-time breaker keeps tripping on start. What is (a) the normal maximum breaker and (b) the maximum after sizing up?',
 num:{v:300,tol:0.001,u:'A'},sim:'motor',
 a:'(a) <b>200 A</b> (192.5 A → next higher standard). (b) <b>300 A</b> (400 % × 77 = 308 A → largest standard not above).',
 steps:['FLC = <code>77 A</code> (460 V table).','(a) Normal: <code>77 × 2.50 = 192.5 A</code> → not a standard size → next higher standard: <code>200 A</code>.','(b) The motor will not start: FLC ≤ 100 A → inverse-time breaker may go to <b>400 %</b>: <code>77 × 4.00 = 308 A</code> → standard sizes 300 (✔), 350 (✘) → <code>300 A</code>.','If the motor FLC were &gt; 100 A the exception would allow only 300 % (e.g. 124 A × 3 = 372 A → 350 A).','Finally check the marking on the contactor/overload relay and the SCCR of the combination before installing 300 A.'],
 why:'Size up only when needed – each step reduces protection of the conductors and the starter. Prefer a softer fix first (soft starter, time-delay fuse, MCP + Type E/F controller).'},
{id:'up-3',t:'upsize',d:3,q:'For the <b>15 hp, 460 V</b> motor (FLC 21 A) using <b>time-delay fuses</b>: normal maximum fuse, and maximum if the fuses blow on starting?',
 num:{v:45,tol:0.001,u:'A'},
 a:'Normal: 175 % → 36.75 A → <b>40 A</b>. Sized up: 225 % → 47.25 A → <b>45 A</b>.',
 steps:['<code>21 × 1.75 = 36.75 A</code> → next higher standard size: <code>40 A</code>.','If the motor still will not start: <code>21 × 2.25 = 47.25 A</code> → standard 45 A is the largest not above → <code>45 A</code>.','For comparison: non-time-delay fuse 300 % = 63 A → 70 A (next up); sized up 400 % = 84 A → 80 A.'],
 why:'Time-delay fuses carry the 6× starting current for several seconds, so they usually need no size-up at all. If they do, check that the new size does not exceed the controller’s marked maximum fuse.'},
{id:'up-4',t:'upsize',d:3,q:'<b>Instantaneous-trip breaker (MCP)</b> on a 15 hp, 460 V motor (FLC 21 A): normal setting and the absolute maximum if the MCP nuisance-trips on inrush?',
 num:{v:168,tol:0.001,u:'A'},
 a:'Normal: 800 % × 21 = <b>168 A</b>. Absolute maximum: 1300 % × 21 = <b>273 A</b> (for Design B energy-efficient motors the table starts at 1100 % = 231 A and the cap is 1700 % = 357 A).',
 steps:['<code>21 × 8 = 168 A</code> (adjustable trip setting – no standard-size rounding).','Raise the setting only until the motor starts, never above <code>21 × 13 = 273 A</code>.','Design B energy-efficient: <code>21 × 11 = 231 A</code> normal, cap <code>21 × 17 = 357 A</code>.'],
 why:'An MCP only provides short-circuit protection and must be part of a <b>listed combination motor controller</b> (starter + overload). <span class="note">Verify the 1100 / 1300 / 1700 % values in your edition.</span>'},
{id:'up-5',t:'upsize',d:3,q:'<b>Group motor:</b> motors of 14 A, 3.4 A and 1.6 A share one <b>inverse-time breaker</b> with manual motor controllers rated for group installation. Maximum breaker?',
 num:{v:40,tol:0.001,u:'A'},
 a:'<b>40 A</b>.',
 steps:['Largest motor: 14 A × 250 % = <code>35 A</code>.','Add the others at 100 %: <code>35 + 3.4 + 1.6 = 40 A</code> (a standard size).','Conditions: all components marked for group installation, tap conductors ≥ 1/10 of the breaker rating (≥ 4 A) and ≥ 125 % of each motor FLA, and the breaker ≤ the “group installation” maximum on every component.'],
 why:'(Eaton p. 10, UL 508A 31.4.) With a time-delay fuse use 175 % of the largest + the rest; with a Class CC fuse use 300 % of the largest + the rest.'},
{id:'up-6',t:'upsize',d:3,q:'<b>Single motor + control transformer</b> sharing the branch device (Eaton p. 68): 10 hp, 460 V motor (FLC 14 A) and a 500 VA 480/120 V CPT (primary 1.04 A). Find the maximum inverse-time breaker and dual-element fuse.',
 num:{v:36.04,tol:0.01,u:'A'},
 a:'Breaker: 14 × 2.5 + 1.04 = <b>36.04 A → 35 A</b>. Dual-element fuse: 14 × 1.75 + 1.04 = <b>25.54 A → 25 A</b>.',
 steps:['<b>1.</b> Motor FLC × % for the device type: breaker <code>14 × 2.50 = 35 A</code>; fuse <code>14 × 1.75 = 24.5 A</code>.','<b>2.</b> Add the full-load <b>primary current of the CPT</b>: <code>1.04 A</code> → <code>36.04 A</code> and <code>25.54 A</code>.','<b>3.</b> Select the closest standard rating: 35 A and 25 A.'],
 why:'Because the control transformer is tapped after the same branch device, its current must be added; ignoring it would under-size the device compared with the real load. This is one of the ways the device “grows” above the motor-only value.'},
{id:'up-7',t:'upsize',d:2,q:'<b>Heater branch protection</b> (Eaton p. 30): a 5 kW, 480 V, 3-phase resistive heater (6.01 A). What is the minimum and maximum branch device?',
 num:{v:7.51,tol:0.01,u:'A'},
 a:'<b>Not less than 125 %</b> = 7.51 A → <b>10 A minimum</b> (round <u>up</u>). <b>Maximum 60 A</b>, and never above the ampacity of the field wiring.',
 steps:['<code>I = 5000 ÷ (1.732 × 480) = 6.01 A</code>.','Minimum: <code>6.01 × 1.25 = 7.51 A</code> → next standard size up: <code>10 A</code>.','Maximum: 60 A (exceptions exist for larger heaters) and ≤ field-wiring ampacity.'],
 why:'Opposite to motors: for heaters 125 % is a <i>minimum</i> (continuous load), so you must round up, not down.'},
{id:'up-7b',t:'upsize',d:3,q:'You calculate an <b>80 A</b> maximum branch fuse for a motor, but the contactor/overload relay label says <b>“Max fuse 60 A Class J”</b>. What do you install?',
 num:{v:60,tol:0.001,u:'A'},
 a:'<b>60 A Class J</b> – the component marking governs. Calculated values are maxima, never targets.',
 steps:['Compute the code maximum (80 A).','Read the maximum protection on every power-circuit component (controller, overload relay, MMC, disconnect).','The lowest limit wins: <code>min(80, 60) = 60 A</code>, and use the class of fuse named in the marking.'],
 why:'The marking is part of the component’s Listing. Using a larger or different-type device invalidates the Listing and usually the SCCR.'},
{id:'up-8',t:'upsize',d:2,q:'A <b>UL 508 Type E / F combination motor controller</b> (manual self-protected motor protector) feeds a motor with FLA 14 A. Why does it not need to be “sized up” like a breaker or fuse, and what is the setting?',
 num:{v:14,tol:0.001,u:'A'},
 a:'It is a <b>self-protected</b> device at <b>100 %</b> of FLA: the adjustable overload is set to 14 A, and the fixed magnetic trip is designed to ride through the starting inrush.',
 steps:['Branch-circuit protection table (Eaton p. 69): breaker 250 %, time-delay fuse 175 %, CC/non-time-delay 300 %, <b>self-protected combination controller 100 %</b>.','Setting: <code>14 × 1.00 = 14 A</code> (within the adjustment range of a motor protector, e.g. 10–16 A).','Compare: a 14 A motor on an inverse-time breaker could use up to 35 A.'],
 why:'(Eaton p. 14: CMCs “do not need to be oversized (as breakers and fuses are) to prevent tripping during motor startup”.) They are also usually the quickest way to reach a high SCCR.'},
{id:'up-9',t:'upsize',d:3,q:'<b>Feeder sizing with a transformer</b> (Eaton p. 4, UL 508A 32.3.1a): loads 3.4 A, 7.6 A, 14 A motors; a 65 A motor on a 125 A breaker (the largest branch device); a 20 A heater; a transformer primary of 1.95 A. Find the maximum feeder device and the minimum feeder conductor ampacity.',
 num:{v:172,tol:0.01,u:'A'},
 a:'Feeder device: 125 + 3.4 + 7.6 + 14 + 20 + 1.95 = <b>172 A → 175 A</b> (guide: “closest size”). Conductors: <b>133.2 A</b> minimum for the load, but to be protected by a 175 A device they must have <b>≥ 175 A</b> (2/0 AWG Cu at 75 °C).',
 steps:['<b>Largest branch protective device</b> (not the largest motor): <code>125 A</code>.','Add the <b>FLC</b> of every other load, including the transformer primary: <code>3.4 + 7.6 + 14 + 20 + 1.95 = 46.95 A</code>.','Total <code>125 + 46.95 = 171.95 ≈ 172 A</code> → closest standard rating <code>175 A</code>.','Conductors for the load: <code>1.25×65 = 81.25</code>, heater <code>1.25×20 = 25</code>, others <code>3.4+7.6+14+1.95 = 26.95</code> → <code>133.2 A</code> → 1/0 AWG (150 A at 75 °C).','Rule from the guide: “the overcurrent feeder rating should not exceed the conductor ampacity on the load side” → the 175 A device needs 2/0 AWG (175 A at 75 °C) or larger.'],
 why:'This is why the feeder device is often much bigger than the load: the branch device with the highest rating is carried in the sum. Note the guide <u>rounds up</u> (172 → 175 A) whereas NEC 430.62 for motor feeders says not to exceed the computed value – for exam questions follow the reference your exam gives you and check the answer choices.'},
/* ---------- TRANSFORMER CURRENT ---------- */
{id:'xc-1',t:'xcur',d:1,q:'<b>single-phase</b> transformer, <b>10 kVA</b>, 480 V primary / 240 V secondary. Find the full-load primary and secondary current.',
 num:{v:20.83,tol:0.01,u:'A (primary)'},sim:'xfmr',
 a:'Primary <b>20.83 A</b>, secondary <b>41.67 A</b>.',
 steps:['Single-phase: <code>I = kVA × 1000 ÷ V</code>.','Primary: <code>10 × 1000 ÷ 480 = 20.83 A</code>.','Secondary: <code>10 × 1000 ÷ 240 = 41.67 A</code>.','Check: the secondary current is higher by the voltage ratio <code>480 ÷ 240 = 2</code> → 20.83 × 2 = 41.67 ✔.'],
 why:'Both windings carry the same kVA; the lower-voltage side carries proportionally more current.'},
{id:'xc-2',t:'xcur',d:2,q:'<b>3-phase</b> transformer, <b>45 kVA</b>, 480 V primary / 208Y/120 V secondary. Find the full-load secondary current.',
 num:{v:124.9,tol:0.01,u:'A (secondary)'},sim:'xfmr',
 a:'Secondary <b>124.9 A</b> (primary 54.1 A).',
 steps:['3-phase: <code>I = kVA × 1000 ÷ (√3 × V<sub>L-L</sub>)</code>, with √3 = 1.732.','Secondary: <code>45 000 ÷ (1.732 × 208) = 45 000 ÷ 360.3 = 124.9 A</code>.','Primary: <code>45 000 ÷ (1.732 × 480) = 45 000 ÷ 831.4 = 54.1 A</code>.'],
 why:'Always use the <b>line-to-line</b> voltage in the 3-phase formula (208 V, not 120 V). 120 V is the line-to-neutral value and would give a wrong current.'},
{id:'xc-3',t:'xcur',d:2,q:'<b>3-phase</b> transformer, <b>112.5 kVA</b>, 480 V → 208Y/120 V. Find the primary and secondary full-load currents.',
 num:{v:135.3,tol:0.01,u:'A (primary)'},sim:'xfmr',
 a:'Primary <b>135.3 A</b>, secondary <b>312.3 A</b>.',
 steps:['<code>I<sub>p</sub> = 112 500 ÷ (1.732 × 480) = 112 500 ÷ 831.4 = 135.3 A</code>.','<code>I<sub>s</sub> = 112 500 ÷ (1.732 × 208) = 112 500 ÷ 360.3 = 312.3 A</code>.','Check: <code>135.3 × 480 ÷ 208 = 312.2 A</code> ✔ (current ratio is the inverse of the voltage ratio).'],
 why:'These two numbers are the starting point for the overcurrent-protection percentages (125 % / 250 %) in the transformer protection questions.'},
{id:'xc-4',t:'xcur',d:2,q:'A <b>single-phase</b> 480 V → 120 V transformer supplies a load drawing <b>25 A</b> on the secondary. What primary current flows (ideal transformer)?',
 num:{v:6.25,tol:0.01,u:'A'},
 a:'<b>6.25 A</b>.',
 steps:['Ideal transformer: V<sub>p</sub> × I<sub>p</sub> = V<sub>s</sub> × I<sub>s</sub>.','<code>I<sub>p</sub> = I<sub>s</sub> × V<sub>s</sub> ÷ V<sub>p</sub> = 25 × 120 ÷ 480 = 6.25 A</code>.','Load size: <code>25 × 120 = 3000 VA = 3 kVA</code>; primary <code>3000 ÷ 480 = 6.25 A</code> ✔.'],
 why:'Current ratio = inverse of the turns/voltage ratio (4 : 1 here, so the primary carries a quarter of the secondary current).'},
{id:'xc-5',t:'xcur',d:2,q:'A <b>3-phase</b> 480 V supply feeds a transformer drawing <b>60 A</b> on the primary at full load. What kVA is it, and which standard size would you select?',
 num:{v:49.9,tol:0.01,u:'kVA'},
 a:'<b>≈ 49.9 kVA → 50 kVA</b>.',
 steps:['<code>kVA = √3 × V × I ÷ 1000</code>.','<code>1.732 × 480 × 60 ÷ 1000 = 49.9 kVA</code>.','Nearest standard 3-phase sizes: 45, <b>50</b>, 75 kVA → 50 kVA.'],
 why:'Always round up to the next standard size when sizing for a load; never down.'},
{id:'xc-6',t:'xcur',d:2,q:'<b>3-phase</b>, <b>75 kVA</b>, 480 V primary. A student forgets the √3 and divides by voltage only. What current do they get, what is the correct current, and by what factor are they wrong?',
 num:{v:90.2,tol:0.01,u:'A (correct)'},
 a:'Wrong: <b>156.3 A</b>. Correct: <b>90.2 A</b>. The error is a factor of √3 = <b>1.732</b>.',
 steps:['Wrong (single-phase formula): <code>75 000 ÷ 480 = 156.25 A</code>.','Correct (3-phase): <code>75 000 ÷ (1.732 × 480) = 90.2 A</code>.','Factor: <code>156.25 ÷ 90.2 = 1.732</code>.'],
 why:'The most common exam mistake: using the single-phase formula on a 3-phase transformer. Whenever the problem says 3-phase, include √3.'},
{id:'xc-7',t:'xcur',d:3,q:'A <b>3-phase</b> 30 kVA transformer (480 V → 208Y/120 V) supplies a panel carrying <b>85 A</b> at 208 V. What is the transformer’s rated secondary current, and is it overloaded?',
 num:{v:83.3,tol:0.01,u:'A (rated)'},sim:'xfmr',
 a:'Rated secondary <b>83.3 A</b>. The load is 85 A = 30.6 kVA → <b>slightly overloaded (≈ 102 %)</b>.',
 steps:['Rated secondary: <code>30 000 ÷ (1.732 × 208) = 83.3 A</code>.','Load kVA: <code>1.732 × 208 × 85 ÷ 1000 = 30.6 kVA</code>.','Compare: <code>85 ÷ 83.3 = 1.02</code> → 102 % of rating.'],
 why:'Transformer loading is judged on the secondary current against the rated secondary current (or kVA against nameplate kVA).'},
{id:'xc-8',t:'xcur',d:2,q:'A <b>single-phase</b> 25 kVA transformer has a 480 V primary and a 240 V secondary (full winding). What are the full-load primary and secondary currents?',
 num:{v:104.2,tol:0.01,u:'A (secondary)'},sim:'xfmr',
 a:'Secondary <b>104.2 A</b>, primary <b>52.1 A</b>.',
 steps:['<code>I<sub>s</sub> = 25 000 ÷ 240 = 104.2 A</code>.','<code>I<sub>p</sub> = 25 000 ÷ 480 = 52.1 A</code>.','Primary protection (primary only, ≥ 9 A → 125 %): <code>52.1 × 1.25 = 65.1 A → 70 A</code> (next size up).'],
 why:'Rated current feeds directly into the overcurrent-protection sizing in the Transformers topic.'},
{id:'xc-9',t:'xcur',d:2,src:SRC_L,q:'State the standard formulas for transformer current. (a) Single-phase, (b) 3-phase line-to-line, (c) what do you do if the load is given in kW and power factor?',
 a:'(a) <code>I = VA ÷ V = (kVA × 1000) ÷ V</code><br>(b) <code>I = VA ÷ (√3 × V<sub>L-L</sub>) = (kVA × 1000) ÷ (1.732 × V<sub>L-L</sub>)</code><br>(c) Convert to apparent power first: <code>kVA = kW ÷ PF</code>, then use (a) or (b).',
 steps:['Transformers are rated in <b>kVA</b> (apparent power), so currents are based on kVA, not kW.','Single-phase uses the voltage of that winding.','3-phase uses the <b>line-to-line</b> voltage and the factor √3 = 1.732.','If only kW is known: kVA = kW ÷ PF (PF is always ≤ 1, so kVA ≥ kW).'],
 why:'Use the same rated voltage on each side to get each side’s current – the kVA is the same on both sides for an ideal transformer.'},
{id:'xc-10',t:'xcur',d:3,src:SRC_L,q:'<b>3-phase</b>, <b>500 kVA</b>, 4160 V primary → 480 V secondary. Find the primary and secondary full-load current.',
 num:{v:69.4,tol:0.01,u:'A (primary)'},sim:'xfmr',
 a:'Primary <b>69.4 A</b>, secondary <b>601.4 A</b>.',
 steps:['<code>I<sub>p</sub> = 500 000 ÷ (1.732 × 4160) = 500 000 ÷ 7 205 = 69.4 A</code>.','<code>I<sub>s</sub> = 500 000 ÷ (1.732 × 480) = 500 000 ÷ 831.4 = 601.4 A</code>.','Check with the voltage ratio: <code>69.4 × 4160 ÷ 480 = 601.4 A</code> ✔ (ratio 8.67 : 1).'],
 why:'The secondary current is almost 9× the primary current – the secondary conductors/bus are far larger than the primary cable.'},
{id:'xc-11',t:'xcur',d:2,src:SRC_L,q:'A <b>3-phase</b> 480 V load is given as <b>120 kW at PF 0.80</b>. (a) What kVA is it? (b) What current does it draw? (c) Which standard transformer size covers it?',
 num:{v:150,tol:0.01,u:'kVA'},
 a:'(a) <b>150 kVA</b> (b) <b>180.4 A</b> (c) <b>150 kVA</b> (zero spare capacity – pick 225 kVA if you need margin or expect growth).',
 steps:['kVA = kW ÷ PF = <code>120 ÷ 0.80 = 150 kVA</code>.','Current: <code>150 000 ÷ (1.732 × 480) = 150 000 ÷ 831.4 = 180.4 A</code>.','Standard 3-phase sizes: 112.5, <b>150</b>, 225 kVA → 150 kVA just covers the load.'],
 why:'Common mistake: sizing the transformer at 120 kVA (using kW) – that would be overloaded by 25 %.'},
{id:'xc-12',t:'xcur',d:2,src:SRC_L,q:'Common mistake: for a <b>75 kVA 3-phase</b> 208Y/120 V secondary, a student uses the <b>120 V</b> (line-to-neutral) value in the 3-phase formula. What current do they get, and what is the correct rated secondary current?',
 num:{v:360.8,tol:0.01,u:'A (wrong value)'},
 a:'Wrong: <b>360.8 A</b>. Correct: <b>208.2 A</b>. The error factor is 208 ÷ 120 = <b>1.732 (√3)</b>.',
 steps:['Wrong: <code>75 000 ÷ (1.732 × 120) = 75 000 ÷ 207.8 = 360.8 A</code>.','Correct: <code>75 000 ÷ (1.732 × 208) = 75 000 ÷ 360.3 = 208.2 A</code>.','Ratio: <code>360.8 ÷ 208.2 = 1.733</code>.'],
 why:'3-phase current calculations use <b>line-to-line</b> voltage (208 V). The 120 V value is only for single-phase loads between a line and the neutral.'},
{id:'xc-13',t:'xcur',d:2,src:SRC_L,q:'Which side of a transformer carries the higher current, and why can the actual primary current be slightly higher than the ideal calculation?',
 a:'The <b>lower-voltage side</b> carries the higher current (kVA is equal on both sides, so current is inversely proportional to voltage). The real primary current is slightly higher than ideal because of <b>transformer losses</b> (core and winding losses), most noticeable at heavy load.',
 steps:['Ideal transformer: <code>kVA<sub>primary</sub> = kVA<sub>secondary</sub></code>.','So <code>I × V</code> is the same both sides → higher voltage = lower current.','Real transformer: <code>input kVA = output kVA + losses</code> → primary current a little higher.'],
 why:'For sizing, start from nameplate kVA and rated voltage, then apply code margins and derating factors.'},
{id:'xc-14',t:'xcur',d:3,src:SRC_L,q:'In the field you measure <b>98 A</b> on the primary of a 75 kVA, 480 V 3-phase transformer at “full load”. What is the percentage of rated current, and what should you check?',
 num:{v:108.6,tol:0.01,u:'%'},
 a:'Rated primary current is 90.2 A → measured is <b>≈ 108.6 %</b> of rating. Verify <b>tap settings, actual voltage, harmonic content, load balance</b> and whether the load is cycling (motors/heaters).',
 steps:['Rated primary: <code>75 000 ÷ (1.732 × 480) = 90.2 A</code>.','Percent: <code>98 ÷ 90.2 = 1.086 → 108.6 %</code>.','A reading meaningfully above the calculated value points to low supply voltage or tap position, non-linear loads (harmonics), unbalance, or a transformer that really is overloaded.'],
 why:'Calculated rated current is the benchmark for field checks – a 3-phase transformer that reads above it needs investigation before it overheats.'},
{id:'xc-15',t:'xcur',d:3,src:SRC_L,q:'A <b>3-phase</b> transformer feeds loads with phase currents of <b>95 A, 80 A and 65 A</b>. What is the average current and by how much is the highest phase above it?',
 num:{v:118.75,tol:0.01,u:'% of average'},
 a:'Average <b>80 A</b>; the highest phase is <b>118.75 %</b> of the average (15 A above).',
 steps:['Average: <code>(95 + 80 + 65) ÷ 3 = 240 ÷ 3 = 80 A</code>.','Highest vs average: <code>95 ÷ 80 = 1.1875 → 118.75 %</code>.','Maximum deviation from average: <code>95 − 80 = 15 A</code> (15 ÷ 80 = 18.75 %).'],
 why:'Unbalanced 3-phase loads can push one phase above the “average” calculated current, which is what heats the winding and trips protection. Balance the single-phase loads across the phases.'},
{id:'xc-16',t:'xcur',d:3,src:SRC_L,q:'The 25 kVA single-phase transformer (240 V secondary) feeds a <b>continuous</b> control-panel load at full rating. Find the minimum secondary conductor ampacity using the 125 % continuous-load rule and select the copper size (75 °C column).',
 num:{v:130.2,tol:0.01,u:'A'},sim:'motor',
 a:'<b>130.2 A</b> → <b>1/0 AWG</b> Cu (150 A at 75 °C). 1 AWG (130 A) is just short.',
 steps:['Secondary current: <code>25 000 ÷ 240 = 104.2 A</code>.','Continuous load: <code>104.17 × 1.25 = 130.2 A</code>.','Circuit &gt; 100 A → 75 °C column: 1 AWG = 130 A ✘ (just under 130.2 A), <b>1/0 = 150 A</b> ✔.'],
 why:'The article notes many designs apply 125 % for continuous loads (NEC conductor/OCPD rules for the load type). Always compare the result against the exact ampacity, not the rounded one – 130 A fails against 130.2 A.'},
{id:'xc-17',t:'xcur',d:3,src:SRC_L,q:'After calculating the transformer current, which NEC articles set the final design? Match: (a) Article 450 (b) Article 240 (c) Article 310 (d) Article 250.',
 a:'<b>450</b> – transformer installation, ventilation and overcurrent protection (primary/secondary, next-standard-size rules).<br><b>240</b> – overcurrent protection requirements and limits.<br><b>310</b> – conductor ampacity tables and correction/adjustment factors (ambient temperature, bundling).<br><b>250</b> – grounding and bonding, including separately derived systems.',
 why:'The article stresses that the current calculation is “the starting line, not the finish line”: code-driven conductor and OCPD sizing completes the job. Inrush must also be considered so that protection does not nuisance-trip.'},
{id:'xc-18',t:'xcur',d:2,src:SRC_L,q:'List the six most common mistakes when calculating transformer current.',
 a:'<ol><li>Using <b>kW instead of kVA</b> (convert with kVA = kW ÷ PF).</li><li>Mixing up <b>208 V line-to-line vs 120 V line-to-neutral</b>.</li><li>Forgetting <b>√3</b> on a 3-phase calculation (under-sizes conductors).</li><li>Ignoring <b>harmonics and neutral loading</b> from non-linear loads.</li><li>Assuming <b>perfect balance</b> on 3-phase loads.</li><li>Not accounting for <b>duty cycle, ambient temperature</b> or enclosure constraints (continuous loading may require upsizing).</li></ol>',
 why:'Several exam items reduce to these traps: check the units (VA vs W), the voltage (line-to-line), and the phase count before calculating.'},
{id:'xc-19',t:'xcur',d:2,src:SRC_L,q:'A transformer feeds many <b>switch-mode power supplies, VFDs and LED drivers</b>. What problem does this create and what are the remedies?',
 a:'<b>Harmonic currents</b> raise winding/core heating and load the <b>neutral</b> heavily. Remedies: a <b>K-factor-rated</b> or harmonic-mitigating transformer, and verify (oversize) the neutral conductor.',
 why:'A standard transformer sized only from fundamental-frequency kVA can overheat with non-linear loads even when the measured RMS current looks acceptable.'},
{id:'xc-20',t:'xcur',d:2,src:SRC_L,q:'What information should you collect before specifying a transformer for an industrial application?',
 a:'<ul><li><b>kVA</b> (or kW + power factor)</li><li><b>Primary voltage</b> and system type (single/3-phase, delta/wye)</li><li><b>Secondary voltage</b> and system type, and whether a <b>neutral</b> is required</li><li><b>Frequency</b> (60 Hz in the U.S.)</li><li><b>Load type</b> (motors/VFDs, rectifiers, LED drivers, UPS, welders)</li><li><b>Environment</b> (indoor/outdoor, corrosive, ambient, ventilation)</li><li><b>Installation/code constraints</b> (OCPD approach, separately derived system, grounding method)</li></ul>',
 why:'Collecting these first avoids rework; load type and environment drive duty cycle, K-factor and enclosure choices.'},
{id:'xc-21',t:'xcur',d:3,src:SRC_L,q:'When does a transformer create a <b>separately derived system</b>, and why does it matter for grounding?',
 a:'When the transformer’s secondary has <b>no direct electrical connection</b> (other than grounding/bonding) to the supply conductors – typically a transformer with isolated windings. It matters because the <b>neutral-to-ground bonding location, grounding electrode conductor and bonding</b> must be set up at the transformer (NEC Article 250), and the design must match the system type (wye/delta, grounded/ungrounded, corner-grounded delta).',
 why:'Typical error: bonding the neutral at both the transformer and the downstream panel, which puts neutral current on the grounding path.'},
{id:'xi-1',t:'xcur',d:2,src:SRC_I,q:'A transformer rated for 480 V 3-phase input is wired to only <b>two legs</b> (line-to-line) of the supply. Do you use the 3-phase formula (with √3) or the single-phase formula?',
 a:'Use the <b>single-phase</b> formulas: <code>I = (kVA × 1000) ÷ V</code> on each side. The √3 multiplier applies only to true 3-phase loads.',
 steps:['Two legs of a 3-phase supply give a single 480 V line-to-line circuit feeding one winding.','Primary: <code>I<sub>p</sub> = VA ÷ 480</code>. Secondary: <code>I<sub>s</sub> = VA ÷ V<sub>s</sub></code>.','No √3 anywhere – there is only one phase of current in the transformer.'],
 why:'The 3-phase formula divides by √3 because the power is shared across three conductors. With two legs all the power flows through one pair of conductors, so you must not divide by 1.732 (that would under-size the conductors and fuses).'},
{id:'xi-2',t:'xcur',d:1,src:SRC_I,q:'A <b>0.85 kVA</b> (850 VA) transformer, 480 V primary (two legs) → 120 V secondary. Find the full-load primary and secondary current.',
 num:{v:1.77,tol:0.01,u:'A (primary)'},sim:'xfmr',
 a:'Primary <b>1.77 A</b>, secondary <b>7.08 A</b>.',
 steps:['<code>I<sub>p</sub> = 850 ÷ 480 = 1.77 A</code>.','<code>I<sub>s</sub> = 850 ÷ 120 = 7.08 A</code>.','Check: <code>1.77 × (480 ÷ 120) = 7.08 A</code> ✔.'],
 why:'These are the nameplate full-load currents. They set the protection sizes (see the fuse question) and the maximum load you can connect.'},
{id:'xi-3',t:'xcur',d:3,src:SRC_I,q:'A builder calculates the primary current of the 850 VA, 480 V transformer as <b>1.28 A</b> using <code>((kVA×1000) ÷ (E × 1.73)) × 1.25</code>. Reproduce the 1.28 A, then give the correct single-phase value with the same 125 % factor.',
 num:{v:1.28,tol:0.01,u:'A (3-phase formula)'},
 a:'The 3-phase formula: <code>850 ÷ (1.73 × 480) = 1.02 A</code>, × 1.25 = <b>1.28 A</b> – that is why the builder gets 1.28 A.<br>Correct single-phase: <code>850 ÷ 480 = 1.77 A</code>, × 1.25 = <b>2.21 A</b>.',
 steps:['Builder’s 3-phase result: <code>850 ÷ (1.73 × 480) = 850 ÷ 830.4 = 1.024 A</code>.','With 125 %: <code>1.024 × 1.25 = 1.28 A</code> ✔ (reproduces the number).','Correct single-phase (two legs): <code>850 ÷ 480 = 1.77 A</code>; × 1.25 = <code>2.21 A</code>.','The wrong formula is low by the factor <code>1.77 ÷ 1.02 = 1.73 (√3)</code>.'],
 why:'A 1.28 A answer from the 3-phase formula is a sign the wrong formula was used. The 125 % factor is a conductor/continuous-load margin; it is not the way to choose a transformer fuse (see the fuse question). <span class="note">The source article’s FAQ attributes the 1.28 A to the actual load; the arithmetic above shows it equals the 3-phase-formula-with-125 % result.</span>'},
{id:'xi-4',t:'xcur',d:2,src:SRC_I,q:'By what percentage would a <b>3-phase</b> formula under-state the primary current of the 850 VA transformer on a 2-leg 480 V connection?',
 num:{v:42.3,tol:0.02,u:'% too low'},
 a:'The 3-phase formula gives 1.02 A versus the true 1.77 A → it is <b>≈ 42 % too low</b> (1 − 1/1.732 = 42.3 %).',
 steps:['3-phase formula: <code>850 ÷ (1.732 × 480) = 1.02 A</code>.','True single-phase: <code>850 ÷ 480 = 1.77 A</code>.','Error: <code>(1.77 − 1.02) ÷ 1.77 = 0.423 → 42.3 %</code>.'],
 why:'Under-estimating current means under-sized conductors and fuses that blow or overheat. Check how the transformer is actually connected before choosing the formula.'},
{id:'xi-5',t:'xfmr',d:3,src:SRC_I,q:'The 850 VA, 480/120 V transformer (primary 1.77 A, secondary 7.08 A) is to be fused. The source suggests a <b>2 A fast-blow</b> primary fuse (125 % of 1.77 A). What do the NEC 450.3(B) rules allow for (a) primary-only protection and (b) primary + secondary protection?',
 num:{v:5.31,tol:0.01,u:'A (primary-only max)'},sim:'xfmr',
 a:'(a) Primary only: I<sub>p</sub> &lt; 2 A → <b>300 %</b> = <b>5.31 A → 5 A</b> (time-delay).<br>(b) Primary + secondary: primary 250 % = 4.42 A → <b>4 A</b>; secondary 7.08 A (&lt; 9 A) × 167 % = 11.8 A → <b>10 A</b>.<br>A 2 A fuse is <i>within</i> the limit (113 % of 1.77 A) but gives little margin for inrush.',
 steps:['<code>I<sub>p</sub> = 850 ÷ 480 = 1.77 A</code>; <code>I<sub>s</sub> = 850 ÷ 120 = 7.08 A</code>.','(a) I<sub>p</sub> &lt; 2 A, primary only → 300 %: <code>1.77 × 3.00 = 5.31 A</code> → <code>5 A</code>.','(b) Primary + secondary: <code>1.77 × 2.50 = 4.42 A → 4 A</code>; secondary &lt; 9 A → 167 %: <code>7.08 × 1.67 = 11.8 A → 10 A</code>.','Check the 2 A fuse: <code>2 ÷ 1.77 = 113 %</code> – allowed, but a transformer’s magnetising inrush (8–12× rated) can open a small fast-acting fuse.'],
 why:'<b>Use a time-delay fuse</b> on a transformer primary because of inrush (the Eaton overview also lists time-delay fuses for transformer loads). The article’s statement that sub-1000 VA transformers need primary protection of 125 % is not what Table 450.3(B) gives for currents under 9 A (167 %) and 2 A (300 %), and a marked protection rating on the transformer overrides everything. <span class="note">Verify against your NEC edition and the transformer nameplate.</span>'},
{id:'xi-6',t:'xcur',d:2,src:SRC_I,q:'A test station needs <b>9.5 A at 120 V</b> (continuous). What minimum kVA is required, and which standard size would you pick from 0.75, 1.0, 1.5 and 2.0 kVA? Give the secondary current of each size.',
 num:{v:1.14,tol:0.01,u:'kVA'},sim:'xfmr',
 a:'Load = 9.5 × 120 = <b>1.14 kVA</b> → pick <b>1.5 kVA</b> (12.5 A). With 125 % for continuous duty: 11.9 A → still 1.5 kVA.<br>Secondary currents: 0.75 kVA = 6.25 A; 1.0 kVA = 8.33 A; 1.5 kVA = 12.5 A; 2.0 kVA = 16.7 A.',
 steps:['Load VA: <code>9.5 × 120 = 1140 VA = 1.14 kVA</code>.','Secondary current of each size: <code>kVA × 1000 ÷ 120</code> → 6.25, 8.33, 12.5, 16.7 A.','0.75 and 1.0 kVA are too small (6.25, 8.33 &lt; 9.5 A); 1.5 kVA supplies 12.5 A ≥ 9.5 A (and ≥ 11.9 A = 9.5 × 1.25).','Choose <b>1.5 kVA</b>.'],
 why:'Always round up to the next standard transformer size, and leave headroom for inrush of control loads. The primary current of the 1.5 kVA unit at 480 V is <code>1500 ÷ 480 = 3.13 A</code>.'},
{id:'xi-7',t:'xcur',d:2,src:SRC_I,q:'After installing a 480 V → 120 V transformer, what should you verify, and what are the acceptable voltage ranges? Give the low limit of the primary range.',
 num:{v:432,tol:0.001,u:'V'},
 a:'Primary within <b>±10 %</b> of 480 V → <b>432–528 V</b>. Secondary within <b>±5 %</b> of 120 V → <b>114–126 V</b> (under load). Primary current must not exceed the nameplate FLA. Check for abnormal heating after a <b>30-minute run</b>.',
 steps:['Primary: <code>480 × 0.90 = 432 V</code>, <code>480 × 1.10 = 528 V</code>.','Secondary: <code>120 × 0.95 = 114 V</code>, <code>120 × 1.05 = 126 V</code>.','Compare measured primary current with the rated <code>1.77 A</code> (850 VA unit).','Feel/measure the enclosure temperature after about 30 minutes at load.'],
 why:'Low primary voltage raises the current for the same kVA, and a loaded secondary that falls below −5 % often means the transformer is overloaded or the impedance is high.'},
{id:'xi-8',t:'xcur',d:2,src:SRC_I,q:'The 120 V load of a test station exceeds the 7 A the small transformer can supply. List the alternatives.',
 a:'<ol><li><b>Upsize the transformer</b> (1.5 kVA = 12.5 A, 2.0 kVA = 16.7 A).</li><li>Run a <b>direct 120 V circuit</b> (15 A or 20 A) from the building panel if one is nearby.</li><li>Install a larger <b>isolation transformer</b> sized for the maximum expected load.</li><li>Use <b>separate transformers</b> for different voltage needs inside the panel.</li></ol>',
 why:'When changing the transformer remember to resize the primary fuse and primary/secondary conductors from the new nameplate currents.'},
/* ---------- WIRE ---------- */
{id:'wire-1',t:'wire',d:2,q:'What is the smallest copper equipment grounding conductor (AWG) for circuits protected by a <b>100 A</b> breaker?',
 num:{v:8,tol:0.001,u:'AWG'},
 a:'<b>8 AWG</b> copper.',
 steps:['Size the EGC from the <b>rating of the overcurrent device</b> ahead of the circuit (NEC 250.122 / UL 508A Table 33.1 style).','15 A → 14 · 20 A → 12 · 60 A → 10 · <b>100 A → 8</b> · 200 A → 6 · 300 A → 4 · 400 A → 3 · 500 A → 2 · 600 A → 1.'],
 why:'The EGC must carry fault current long enough for the breaker/fuse to open. The size follows the device, not the load.'},
{id:'wire-2',t:'wire',d:1,q:'What colors identify the grounded conductor and the equipment-grounding conductor in a panel?',
 a:'Grounded (neutral) conductor: <b>white or natural gray</b>. Equipment-grounding conductor: <b>green or green with yellow stripe</b> (bare also acceptable). Never use these colors for ungrounded conductors.',
 why:'UL 508A does not require specific colors for hot conductors. (NFPA 79 for machinery typically uses black = AC/DC power, red = AC control, blue = DC control, yellow = interlocked external power.)'},
{id:'wire-3',t:'wire',d:2,q:'Which ampacity column do you normally use for panel field-wiring terminals on circuits of 100 A or less, and why?',
 a:'The <b>60 °C</b> column (unless the terminals are marked for 75 °C or higher and all other limits allow it).',
 why:'Equipment ≤ 100 A is assumed to have 60 °C terminals unless marked otherwise. For > 100 A, 75 °C is assumed.'},
{id:'wire-4',t:'wire',d:3,q:'What is the allowable current of a <b>copper bus bar 1/4 in. × 2 in.</b> using the UL 508A rule of thumb?',
 num:{v:500,tol:0.001,u:'A'},
 a:'<b>500 A</b> (1000 A per in² of copper).',
 steps:['Cross-section: <code>0.25 × 2 = 0.5 in²</code>.','Current density rule: copper <b>1000 A/in²</b> (aluminum about 700 A/in²).','<code>0.5 × 1000 = 500 A</code>.'],
 why:'Bus bars can be sized by area (or by a heating test). <span class="note">Verify density values in your edition.</span>'},
{id:'wire-5',t:'wire',d:3,q:'Voltage drop: a 3-phase 460 V circuit, <b>24 A</b>, <b>100 ft</b> one-way, <b>10 AWG copper</b> (R ≈ 1.24 Ω/1000 ft). Find the drop and percentage.',
 num:{v:5.15,tol:0.02,u:'V'},
 a:'<b>≈ 5.2 V → 1.12 %</b> (within the common 3 % guideline).',
 steps:['Resistance of one conductor: <code>R = 1.24 × 100/1000 = 0.124 Ω</code>.','3-phase drop: <code>V<sub>d</sub> = √3 × I × R = 1.732 × 24 × 0.124 = 5.15 V</code>.','Percent: <code>5.15 / 460 = 1.12 %</code>.'],
 why:'Voltage drop is a design recommendation (NEC informational note), not a UL 508A pass/fail rule – but good practice.'},
{id:'wire-6',t:'wire',d:3,q:'A 480 V, 3-phase panel (use the 460 V motor table) runs: 15 hp (21 A), 5 hp (7.6 A), 2 hp (3.4 A) and a 5 kW, 480 V resistive 3-phase heater (heaters count at 125 % for the conductors, per the Eaton guide p. 41). Find (a) total full-load current, (b) minimum supply conductor ampacity, (c) minimum disconnect current rating (115 % rule).',
 num:{v:38.0,tol:0.01,u:'A'},
 a:'(a) <b>38.0 A</b> (b) <b>44.8 A → 6 AWG (60 °C)</b> (c) <b>≥ 43.7 A → next available disconnect, e.g. 60 A</b>.',
 steps:['Heater: <code>I = 5000 / (1.732 × 480) = 6.01 A</code>.','Total FLC: <code>21 + 7.6 + 3.4 + 6.01 = 38.0 A</code> (marked as panel FLC).','Supply conductors: 125 % of heater loads + 125 % of the largest motor + FLC of the rest → <code>1.25×6.01 + 1.25×21 + 7.6 + 3.4 = 7.51 + 26.25 + 11.0 = 44.8 A</code> → 8 AWG = 40 A ✘, <b>6 AWG = 55 A</b> ✔.','Disconnect: <code>38.0 × 1.15 = 43.7 A</code> → select the next standard rating (60 A).'],
 why:'If the heater nameplate gives amps, use that value. Motor FLC comes from the table (460 V column covers 440–480 V systems).'},
/* ---------- MATH ---------- */
{id:'math-1',t:'math',d:2,q:'Estimate the 3-phase input current of a <b>20 hp</b> motor at <b>460 V</b>, efficiency <b>92 %</b>, power factor <b>0.85</b>. Compare to the table FLC.',
 num:{v:24,tol:0.03,u:'A'},
 a:'<b>≈ 24 A</b> actual (table FLC = 27 A, intentionally higher).',
 steps:['Output power: <code>20 × 0.746 = 14.92 kW</code>.','Input power: <code>14.92 / 0.92 = 16.22 kW</code>.','<code>I = P / (√3 × V × PF) = 16 217 / (1.732 × 460 × 0.85) = 16 217 / 677.2 = 23.95 A</code>.'],
 why:'The tables assume conservative efficiency/PF, so table FLC ≥ typical real current.',sim:'wave'},
{id:'math-2',t:'math',d:1,q:'A 3-phase <b>480Y/277 V</b> wye system: what is line-to-neutral voltage?',
 num:{v:277,tol:0.01,u:'V'},
 a:'<b>277 V</b>.',
 steps:['Wye: <code>V<sub>L-L</sub> = √3 × V<sub>L-N</sub></code>.','<code>V<sub>L-N</sub> = 480 / 1.732 = 277 V</code>.','Similarly 208Y → 120 V.']},
{id:'math-3',t:'math',d:2,q:'Full-load current of a <b>5 kW, 480 V, 3-phase</b> resistive heater?',
 num:{v:6.01,tol:0.02,u:'A'},
 a:'<b>6.01 A</b>.',
 steps:['Resistive load: PF = 1.','<code>I = P / (√3 × V) = 5000 / (1.732 × 480) = 6.01 A</code>.']},
{id:'math-4',t:'math',d:3,q:'A load draws <b>30 A</b> at <b>460 V, 3-phase</b>, PF 0.80. Find S (kVA), P (kW) and Q (kvar).',
 num:{v:19.1,tol:0.02,u:'kW'},
 a:'S = <b>23.9 kVA</b>, P = <b>19.1 kW</b>, Q = <b>14.3 kvar</b>.',
 steps:['<code>S = √3 V I = 1.732 × 460 × 30 = 23 902 VA</code>.','<code>P = S × PF = 23 902 × 0.8 = 19 122 W</code>.','<code>Q = S × sin φ = 23 902 × 0.6 = 14 341 var</code> (cos φ = 0.8 → sin φ = 0.6).'],
 why:'Check: S² = P² + Q² (power triangle).',fig:'tri',sim:'wave'},
/* ---------- CONTROLS ---------- */
{id:'ctrl-1',t:'ctrl',d:2,q:'What is the difference between a <i>branch-circuit</i> protective device and a <i>supplemental</i> protective device? Give examples.',
 a:'<b>Branch-circuit rated</b>: may be the main short-circuit protection for a branch circuit – UL 489 molded-case breakers, UL 248 fuses (Class J, CC, T, RK1/RK5 …).<br><b>Supplemental</b>: only for additional protection <i>downstream</i> of a branch device – UL 1077 breakers (“recognized”/tripping devices), UL 248-14 supplemental fuses (e.g. GMC, midget-type).',
 why:'A UL 1077 supplemental protector cannot replace the branch device, and its short-circuit rating (5 kA default; limited by fuse upstream) often sets panel SCCR.'},
{id:'ctrl-2',t:'ctrl',d:2,q:'What do overload relay trip classes 10, 20 and 30 mean?',
 a:'The class is the <b>maximum time in seconds</b> the relay takes to trip at <b>600 % (6×) of its set current</b>: Class 10 ≤ 10 s, Class 20 ≤ 20 s, Class 30 ≤ 30 s.',
 why:'Class 10 for ordinary starting; class 20 for heavier loads (fans, pumps); class 30 for very long acceleration (large inertia). Try it in the overload simulator.',sim:'starter'},
{id:'ctrl-3',t:'ctrl',d:2,q:'List the four functions a complete motor branch circuit must provide.',
 a:'<ol><li><b>Disconnect</b> means</li><li><b>Short-circuit / ground-fault protection</b> (branch circuit protective device)</li><li><b>Motor controller</b> (contactor / starter)</li><li><b>Overload protection</b></li></ol>',
 why:'Combination starters (e.g. MCP + contactor + overload) integrate some of these. A tested combination often also raises SCCR.',sim:'motor'},
{id:'ctrl-4',t:'ctrl',d:2,q:'Explain the standard 3-wire start/stop circuit: contact types and why a power failure does not restart the motor.',
 a:'<b>Stop</b> = normally <b>closed</b> in series; <b>Start</b> = normally <b>open</b>; an auxiliary contact <b>M</b> (normally open) in <b>parallel</b> with Start “seals in” the coil; overload contacts (normally closed) in series with the coil.<br>If power is lost the coil drops out, the M contact opens and <b>the circuit stays off until Start is pressed again</b> (low-voltage protection).',
 why:'A wire-break in the stop circuit stops the motor (fail-safe) – that’s why Stop is NC. See the animated ladder in the simulator.',sim:'starter'},
{id:'ctrl-5',t:'ctrl',d:3,q:'What is the difference between Type 1 and Type 2 coordination of a motor starter with its short-circuit protective device?',
 a:'<b>Type 1</b>: after a short-circuit the starter may be <b>damaged and need repair or replacement</b>, but there is no danger to people.<br><b>Type 2</b>: after a short-circuit the starter is <b>suitable for further use</b>; only light contact welding that is easily separated is allowed.',
 why:'Type 2 is the better (and often higher-SCCR) combination; check the manufacturer’s tables.'},
{id:'ctrl-6',t:'ctrl',d:2,q:'Why must the overload relay and the branch short-circuit device be sized from different current values?',
 a:'The branch device must tolerate motor starting current but clear short circuits: it is sized as a % of the <b>table FLC</b>. The overload relay protects the actual motor against sustained overcurrent: it is sized from the motor’s <b>nameplate FLA</b> (+ service factor).',
 why:'If the overload was sized from the table value it could be set above what the motor can tolerate.'},
];

/* ============================== figures ============================== */
function figPct(){ // percent of FLC ladder
 const items=[['Dual-element fuse',175],['Inverse-time CB',250],['Non-time-delay fuse',300],['Instantaneous (MCP)',800]];
 let s='<svg viewBox="0 0 520 170" role="img" aria-label="Maximum branch protection as percent of FLC" style="width:100%;max-width:560px"><text x="8" y="16" font-size="13" font-weight="700">Max short-circuit device, % of table FLC</text>';
 items.forEach((it,i)=>{const w=it[1]/800*300,y=30+i*32;
  s+=`<text x="8" y="${y+15}" font-size="12">${it[0]}</text><rect x="150" y="${y}" width="${w}" height="20" rx="4" fill="var(--acc)"/><text x="${156+w}" y="${y+15}" font-size="12" font-weight="700">${it[1]}%</text>`});
 return s+'</svg>'}
function barSvg(list,fault){ // list of [name,kA]
 const W=520,L=170,H=24+list.length*28+22,max=Math.log10(300),min=list.reduce((a,b)=>Math.min(a,b[1]),1e9);
 const X=v=>L+(Math.log10(Math.max(v,1))/max)*(W-L-30);
 let s=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:600px" role="img" aria-label="SCCR of each component"><text x="8" y="16" font-size="12" font-weight="700">Component SCCR (kA, log scale)</text>`;
 list.forEach((it,i)=>{const y=26+i*28,low=it[1]===min;
  s+=`<text x="8" y="${y+15}" font-size="12">${it[0]}</text><rect x="${L}" y="${y}" width="${Math.max(X(it[1])-L,2)}" height="20" rx="4" fill="${low?'var(--bad)':'var(--acc)'}" opacity="${low?1:.75}"/><text x="${X(it[1])+5}" y="${y+15}" font-size="12" font-weight="700">${it[1]}</text>`});
 if(fault){const fx=X(fault);s+=`<line x1="${fx}" x2="${fx}" y1="20" y2="${H-14}" stroke="var(--warn)" stroke-width="2" stroke-dasharray="5 3"/><text x="${fx}" y="${H-2}" font-size="11" text-anchor="middle" fill="var(--warn)" style="fill:var(--warn)">available ${fault} kA</text>`}
 return s+'</svg>'}
